<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="How the TikTok Shop Scraper works">
  <rect width="1200" height="720" fill="#F6F9FC"/>

  <text x="600" y="70" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0B1F33">How it works</text>
  <text x="600" y="108" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#5A7186">Keyword, product, store or creator in — one fully detailed row per product out</text>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 z" fill="#5B3DF5"/>
    </marker>
  </defs>

  <!-- ============ Input ============ -->
  <text x="72" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#5B3DF5">YOU GIVE</text>

  <rect x="72" y="206" width="264" height="72" rx="14" fill="#FFFFFF" stroke="#C9DAEA" stroke-width="2"/>
  <text x="204" y="236" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F33">A keyword</text>
  <text x="204" y="262" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5A7186">protein powder</text>

  <rect x="72" y="290" width="264" height="72" rx="14" fill="#FFFFFF" stroke="#C9DAEA" stroke-width="2"/>
  <text x="204" y="320" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F33">a product URL</text>
  <text x="204" y="346" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5A7186">tiktok.com/view/product/1732…</text>

  <rect x="72" y="374" width="264" height="72" rx="14" fill="#FFFFFF" stroke="#C9DAEA" stroke-width="2"/>
  <text x="204" y="404" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F33">a store URL</text>
  <text x="204" y="430" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5A7186">tiktok.com/shop/store/equip/…</text>

  <rect x="72" y="458" width="264" height="72" rx="14" fill="#EEEAFE" stroke="#C4B8FA" stroke-width="2"/>
  <text x="204" y="488" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F33">or a creator</text>
  <text x="204" y="514" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#5A7186">@handle — their showcase</text>

  <!-- arrows into the engine -->
  <g stroke="#5B3DF5" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M336 242 L432 242 L432 336 L492 336"/>
    <path d="M336 326 L432 326 L432 364 L492 364"/>
    <path d="M336 410 L432 410 L432 392 L492 392"/>
    <path d="M336 494 L432 494 L432 420 L492 420"/>
  </g>

  <!-- engine -->
  <rect x="500" y="248" width="266" height="260" rx="16" fill="#5B3DF5"/>
  <text x="633" y="290" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Read every product page</text>
  <text x="633" y="322" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#DDD6FE">every SKU with its stock</text>
  <text x="633" y="348" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#DDD6FE">price, discount, units sold</text>
  <text x="633" y="374" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#DDD6FE">rating, images, categories</text>
  <text x="633" y="400" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#DDD6FE">the videos selling it</text>
  <text x="633" y="426" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#DDD6FE">reviews, verified-purchase flag</text>
  <text x="633" y="452" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#DDD6FE">shop stats in every row</text>
  <text x="633" y="486" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#DDD6FE">no login · no cookies · 16 markets</text>

  <path d="M766 378 L840 378" stroke="#5B3DF5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- output -->
  <rect x="848" y="222" width="280" height="312" rx="16" fill="#FFFFFF" stroke="#C9DAEA" stroke-width="2"/>
  <text x="988" y="262" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1F33">You get back</text>
  <text x="988" y="290" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#5A7186">Equip Prime Clean Protein Powder</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#40566B">
    <text x="874" y="326">price</text>
    <text x="1104" y="326" text-anchor="end" font-weight="700" fill="#0B1F33">$51.99 – $88.39</text>
    <text x="874" y="356">units sold</text>
    <text x="1104" y="356" text-anchor="end" font-weight="700" fill="#16A34A">4,682</text>
    <text x="874" y="386">SKUs · stock</text>
    <text x="1104" y="386" text-anchor="end" font-weight="700" fill="#0B1F33">17 · 22,481</text>
    <text x="874" y="416">rating</text>
    <text x="1104" y="416" text-anchor="end" font-weight="700" fill="#CA8A04">★ 4.4 (279)</text>
    <text x="874" y="446">selling videos</text>
    <text x="1104" y="446" text-anchor="end" font-weight="700" fill="#0B1F33">20</text>
    <text x="874" y="476">verified reviews</text>
    <text x="1104" y="476" text-anchor="end" font-weight="700" fill="#0B1F33">30</text>
    <text x="988" y="514" text-anchor="middle" font-size="14" fill="#5A7186">plus seller, shop stats, images, categories</text>
  </g>

  <!-- honesty strip -->
  <rect x="72" y="576" width="1056" height="88" rx="16" fill="#FFFFFF" stroke="#C9DAEA" stroke-width="2"/>
  <text x="600" y="612" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F33">One product, one row, one charge · however many SKUs, videos or reviews it carries</text>
  <text x="600" y="642" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#5A7186">A product that cannot be read is listed in the run's ERRORS record with the reason — and is not billed</text>
</svg>
