<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea4c89"/>
      <stop offset="58%" stop-color="#c32361"/>
      <stop offset="100%" stop-color="#8d1544"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffeaf2"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="dsLite" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5c0d2c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- decorative rings -->
  <g opacity="0.12">
    <circle cx="436" cy="84" r="104" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5 9"/>
    <circle cx="74" cy="440" r="86" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5 9"/>
  </g>

  <!-- a grid of design shots, the thing this actor returns -->
  <g filter="url(#ds)">
    <rect x="96"  y="118" width="150" height="112" rx="16" fill="url(#tile)"/>
    <rect x="266" y="118" width="150" height="112" rx="16" fill="url(#tile)" opacity="0.93"/>
    <rect x="96"  y="250" width="150" height="112" rx="16" fill="url(#tile)" opacity="0.93"/>
    <rect x="266" y="250" width="150" height="112" rx="16" fill="url(#tile)" opacity="0.86"/>
  </g>

  <!-- shot content hints -->
  <g fill="#ea4c89" opacity="0.55">
    <circle cx="128" cy="150" r="11"/><rect x="148" y="143" width="76" height="13" rx="6"/>
    <circle cx="298" cy="150" r="11"/><rect x="318" y="143" width="76" height="13" rx="6"/>
    <circle cx="128" cy="282" r="11"/><rect x="148" y="275" width="76" height="13" rx="6"/>
    <circle cx="298" cy="282" r="11"/><rect x="318" y="275" width="76" height="13" rx="6"/>
  </g>
  <g fill="#c32361" opacity="0.26">
    <rect x="114" y="176" width="114" height="10" rx="5"/><rect x="114" y="196" width="78" height="10" rx="5"/>
    <rect x="284" y="176" width="114" height="10" rx="5"/><rect x="284" y="196" width="60" height="10" rx="5"/>
    <rect x="114" y="308" width="114" height="10" rx="5"/><rect x="114" y="328" width="88" height="10" rx="5"/>
    <rect x="284" y="308" width="100" height="10" rx="5"/><rect x="284" y="328" width="70" height="10" rx="5"/>
  </g>

  <!-- engagement pill: likes / views / saves are the actor's headline fields -->
  <g filter="url(#dsLite)">
    <rect x="128" y="392" width="256" height="62" rx="31" fill="#ffffff"/>
  </g>
  <text x="256" y="433" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="27" fill="#c32361">likes · views · saves</text>
</svg>
