<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15151D"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L10 6 L1 11 z" fill="#3BE0A6"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>

  <text x="60" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" fill="#F5F5F7">How the Naukrigulf Job Scraper works</text>
  <rect x="60" y="98" width="1080" height="3" rx="1.5" fill="#3BE0A6" opacity="0.45"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- 1 -->
    <rect x="60" y="150" width="300" height="200" rx="22" fill="#1B1B24" stroke="#2A2A38" stroke-width="2"/>
    <text x="86" y="196" font-size="20" font-weight="700" fill="#3BE0A6">1 · YOU GIVE IT</text>
    <text x="86" y="236" font-size="21" fill="#D6D6DE">A naukrigulf.com URL</text>
    <text x="86" y="268" font-size="21" fill="#8A8A99">or</text>
    <text x="86" y="300" font-size="21" fill="#D6D6DE">keyword + city + filters</text>
    <text x="86" y="330" font-size="17" fill="#8A8A99">experience · salary · job type</text>

    <!-- 2 -->
    <rect x="450" y="150" width="300" height="200" rx="22" fill="#1B1B24" stroke="#2A2A38" stroke-width="2"/>
    <text x="476" y="196" font-size="20" font-weight="700" fill="#3BE0A6">2 · THE ACTOR</text>
    <text x="476" y="236" font-size="21" fill="#D6D6DE">Builds the canonical URL</text>
    <text x="476" y="268" font-size="21" fill="#D6D6DE">Pages every result</text>
    <text x="476" y="300" font-size="21" fill="#D6D6DE">Opens each job page</text>
    <text x="476" y="330" font-size="17" fill="#8A8A99">pure HTTP · no browser</text>

    <!-- 3 -->
    <rect x="840" y="150" width="300" height="200" rx="22" fill="#1B1B24" stroke="#2A2A38" stroke-width="2"/>
    <text x="866" y="196" font-size="20" font-weight="700" fill="#3BE0A6">3 · YOU GET</text>
    <text x="866" y="236" font-size="21" fill="#D6D6DE">One row per job</text>
    <text x="866" y="268" font-size="21" fill="#D6D6DE">Company · salary · city</text>
    <text x="866" y="300" font-size="21" fill="#D6D6DE">Apply URL · posted date</text>
    <text x="866" y="330" font-size="17" fill="#8A8A99">JSON · CSV · Excel</text>

    <line x1="368" y1="250" x2="440" y2="250" stroke="#3BE0A6" stroke-width="4" marker-end="url(#ar)"/>
    <line x1="758" y1="250" x2="830" y2="250" stroke="#3BE0A6" stroke-width="4" marker-end="url(#ar)"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="60" y="440" font-size="24" font-weight="700" fill="#F5F5F7">Covered across the Gulf</text>
    <g font-size="19" fill="#0A0A0F">
      <rect x="60" y="470" width="118" height="52" rx="26" fill="#3BE0A6"/><text x="119" y="503" text-anchor="middle">UAE</text>
      <rect x="188" y="470" width="190" height="52" rx="26" fill="#3BE0A6"/><text x="283" y="503" text-anchor="middle">Saudi Arabia</text>
      <rect x="388" y="470" width="126" height="52" rx="26" fill="#3BE0A6"/><text x="451" y="503" text-anchor="middle">Qatar</text>
      <rect x="524" y="470" width="122" height="52" rx="26" fill="#3BE0A6"/><text x="585" y="503" text-anchor="middle">Egypt</text>
      <rect x="656" y="470" width="146" height="52" rx="26" fill="#3BE0A6"/><text x="729" y="503" text-anchor="middle">Bahrain</text>
      <rect x="812" y="470" width="120" height="52" rx="26" fill="#3BE0A6"/><text x="872" y="503" text-anchor="middle">Oman</text>
      <rect x="942" y="470" width="140" height="52" rx="26" fill="#3BE0A6"/><text x="1012" y="503" text-anchor="middle">Kuwait</text>
    </g>
    <text x="60" y="600" font-size="21" fill="#8A8A99">Paste a URL or describe the search — the actor builds the rest.</text>
    <text x="60" y="636" font-size="21" fill="#8A8A99">Filters apply before rows reach your dataset, so excluded jobs are not billed.</text>
  </g>
</svg>
