<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15151D"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- A probability split: the YES block fills from the bottom, the NO block sits
       above it, and the divider is where the market has settled. Reads as one shape
       at 48px, and encodes the only number that matters here. -->
  <g>
    <rect x="112" y="112" width="288" height="288" rx="28" fill="#1E2A38"/>
    <path d="M112 232 h288 v140 a28 28 0 0 1 -28 28 h-232 a28 28 0 0 1 -28 -28 Z" fill="#00D48A"/>
    <rect x="112" y="220" width="288" height="24" rx="12" fill="#F5F5F7"/>
  </g>
</svg>
