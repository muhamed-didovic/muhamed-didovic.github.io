<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff850f"/>
      <stop offset="100%" stop-color="#ff850f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a33"/>
      <stop offset="100%" stop-color="#e66100"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- House mark -->
  <g transform="translate(84,104)">
    <rect width="132" height="132" rx="24" fill="url(#tile)"/>
    <path d="M66 22 L112 58 L102 58 L102 108 L30 108 L30 58 L20 58 Z" fill="#ffffff"/>
    <rect x="42" y="66" width="48" height="7" rx="3.5" fill="#ffcaa1"/>
    <rect x="42" y="80" width="36" height="7" rx="3.5" fill="#ffb981"/>
    <rect x="42" y="94" width="26" height="7" rx="3.5" fill="#ff973e"/>
  </g>

  <text x="250" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Homes.com Scraper</text>
  <text x="252" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#ff850f">For sale · For rent · Sold · Agents</text>

  <rect x="84" y="270" width="1030" height="3" fill="url(#rule)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#c9cdd3">
    <text x="84" y="340">Exact city and ZIP boundaries, every listing found</text>
    <text x="84" y="398">Agent emails, brokerages and owner records</text>
    <text x="84" y="456">30+ filters, any homes.com search or property URL</text>
    <text x="84" y="514">Agent lead lists · new-listing alerts · JSON or CSV</text>
  </g>

  <!-- Price badge -->
  <g transform="translate(1000,500)">
    <circle r="68" fill="#2a1a0d"/>
    <text y="-4" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ff850f">$1.50</text>
    <text y="30" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#c9cdd3">per 1,000</text>
  </g>
</svg>
