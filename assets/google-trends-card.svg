<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f5fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#174ea6"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a73e8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a73e8" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0b3d91" flood-opacity="0.13"/>
    </filter>
    <style><![CDATA[
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .s   { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; }
      .mono{ font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace; font-weight: 500; }
    ]]></style>
  </defs>

  <rect width="1200" height="630" fill="url(#cardBg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#1a73e8"/>

  <!-- ============ LEFT: identity + claims ============ -->
  <g transform="translate(72, 92)">
    <!-- logo mark -->
    <rect width="96" height="96" rx="22" fill="url(#markGrad)"/>
    <polyline points="20,72 38,54 56,63 78,28" fill="none" stroke="#ffffff"
              stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="28" r="11" fill="#fdd663"/>

    <text x="120" y="40" class="t" font-size="40" fill="#174ea6">Google Trends</text>
    <text x="120" y="84" class="t" font-size="40" fill="#174ea6">Scraper</text>
  </g>

  <g transform="translate(72, 244)">
    <text x="0" y="0" class="s" font-size="25" fill="#5a6b8c">Trending Now with search volume and growth %,</text>
    <text x="0" y="38" class="s" font-size="25" fill="#5a6b8c">interest over time, interest by region,</text>
    <text x="0" y="76" class="s" font-size="25" fill="#5a6b8c">related queries and related topics.</text>
  </g>

  <!-- claim chips -->
  <g transform="translate(72, 366)">
    <g>
      <rect width="222" height="46" rx="23" fill="#e8f0fe"/>
      <text x="111" y="30" text-anchor="middle" class="lbl" font-size="18" fill="#174ea6">No browser · pure HTTP</text>
    </g>
    <g transform="translate(238, 0)">
      <rect width="196" height="46" rx="23" fill="#e8f0fe"/>
      <text x="98" y="30" text-anchor="middle" class="lbl" font-size="18" fill="#174ea6">Data back to 2004</text>
    </g>
    <g transform="translate(0, 62)">
      <rect width="252" height="46" rx="23" fill="#e6f4ea"/>
      <text x="126" y="30" text-anchor="middle" class="lbl" font-size="18" fill="#137333">Many terms × many countries</text>
    </g>
    <g transform="translate(268, 62)">
      <rect width="166" height="46" rx="23" fill="#e6f4ea"/>
      <text x="83" y="30" text-anchor="middle" class="lbl" font-size="18" fill="#137333">JSON or CSV out</text>
    </g>
  </g>

  <text x="72" y="562" class="mono" font-size="19" fill="#6f7d99">apify.com/memo23/google-trends-scraper</text>

  <!-- ============ RIGHT: chart panel ============ -->
  <g transform="translate(650, 96)" filter="url(#panelShadow)">
    <rect width="478" height="330" rx="20" fill="#ffffff"/>
    <rect width="478" height="56" rx="20" fill="#174ea6"/>
    <rect y="36" width="478" height="20" fill="#174ea6"/>
    <text x="26" y="36" class="lbl" font-size="19" fill="#ffffff">interestOverTime</text>
    <text x="452" y="36" text-anchor="end" class="mono" font-size="16" fill="#8ab4f8">geo: US</text>

    <!-- gridlines -->
    <g stroke="#e8f0fe" stroke-width="2">
      <line x1="30" y1="112" x2="448" y2="112"/>
      <line x1="30" y1="176" x2="448" y2="176"/>
      <line x1="30" y1="240" x2="448" y2="240"/>
    </g>
    <line x1="30" y1="292" x2="448" y2="292" stroke="#d7e3f8" stroke-width="2"/>

    <!-- area + line -->
    <path d="M30,262 L82,232 L134,246 L186,196 L238,214 L290,150 L342,168 L394,110 L448,84 L448,292 L30,292 Z"
          fill="url(#areaFill)"/>
    <polyline points="30,262 82,232 134,246 186,196 238,214 290,150 342,168 394,110 448,84"
              fill="none" stroke="#1a73e8" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="448" cy="84" r="9" fill="#fdd663" stroke="#174ea6" stroke-width="4"/>
  </g>

  <!-- row-type stack -->
  <g transform="translate(650, 452)">
    <g>
      <rect width="152" height="40" rx="10" fill="#ffffff" stroke="#d7e3f8" stroke-width="2"/>
      <text x="76" y="26" text-anchor="middle" class="mono" font-size="15" fill="#174ea6">interestByRegion</text>
    </g>
    <g transform="translate(163, 0)">
      <rect width="146" height="40" rx="10" fill="#ffffff" stroke="#d7e3f8" stroke-width="2"/>
      <text x="73" y="26" text-anchor="middle" class="mono" font-size="15" fill="#174ea6">relatedQueries</text>
    </g>
    <g transform="translate(320, 0)">
      <rect width="158" height="40" rx="10" fill="#ffffff" stroke="#d7e3f8" stroke-width="2"/>
      <text x="79" y="26" text-anchor="middle" class="mono" font-size="15" fill="#174ea6">trendingNow</text>
    </g>
  </g>
</svg>
