<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#322A52"/>
      <stop offset="100%" stop-color="#16121F"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#FFFFFF" opacity="0.045">
    <circle cx="60" cy="60" r="5"/><circle cx="140" cy="60" r="5"/><circle cx="220" cy="60" r="5"/>
    <circle cx="60" cy="570" r="5"/><circle cx="1140" cy="60" r="5"/><circle cx="1140" cy="570" r="5"/>
  </g>

  <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="72" y="86" width="186" height="40" rx="20" fill="#A3E635" opacity="0.15"/>
    <text x="92" y="113" font-size="20" font-weight="700" fill="#A3E635" letter-spacing="2">APIFY ACTOR</text>

    <text x="70" y="208" font-size="74" font-weight="800" fill="#FFFFFF">Keyword</text>
    <text x="70" y="288" font-size="74" font-weight="800" fill="#FFFFFF">Metrics</text>

    <text x="72" y="346" font-size="27" font-weight="500" fill="#C9C7D6">Google + Bing search volume, CPC,</text>
    <text x="72" y="382" font-size="27" font-weight="500" fill="#C9C7D6">difficulty &amp; intent — one flat fee</text>

    <g font-size="20" font-weight="600">
      <rect x="72"  y="430" width="184" height="46" rx="23" fill="#251E3E" stroke="#3D3460"/>
      <text x="98"  y="459" fill="#A3E635">1000 keywords</text>
      <rect x="270" y="430" width="150" height="46" rx="23" fill="#251E3E" stroke="#3D3460"/>
      <text x="296" y="459" fill="#A3E635">93 months</text>
      <rect x="434" y="430" width="128" height="46" rx="23" fill="#251E3E" stroke="#3D3460"/>
      <text x="460" y="459" fill="#A3E635">intent</text>
    </g>

    <text x="72" y="540" font-size="21" font-weight="500" fill="#A8A7B7">111 countries · 46 languages · JSON / CSV / Excel</text>
  </g>

  <!-- RIGHT: a keyword row as the dataset actually returns it -->
  <g filter="url(#ds)" transform="translate(720,150)">
    <rect width="408" height="330" rx="28" fill="#211B36"/>
    <rect width="408" height="330" rx="28" fill="none" stroke="#3D3460" stroke-width="2"/>

    <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      <text x="28" y="56" font-size="23" font-weight="700" fill="#FFFFFF">running shoes</text>

      <rect x="28" y="76" width="96" height="30" rx="15" fill="#22C55E" opacity="0.18"/>
      <text x="44" y="97" font-size="16" font-weight="700" fill="#22C55E">rising</text>

      <!-- volume -->
      <text x="28"  y="152" font-size="15" font-weight="600" fill="#8B89A0">GOOGLE VOL</text>
      <text x="28"  y="186" font-size="34" font-weight="800" fill="#FFFFFF">368,000</text>
      <text x="228" y="152" font-size="15" font-weight="600" fill="#8B89A0">BING VOL</text>
      <text x="228" y="186" font-size="34" font-weight="800" fill="#C9C7D6">21,850</text>

      <line x1="28" y1="212" x2="380" y2="212" stroke="#3D3460" stroke-width="2"/>

      <text x="28"  y="248" font-size="15" font-weight="600" fill="#8B89A0">CPC</text>
      <text x="28"  y="278" font-size="26" font-weight="700" fill="#A3E635">$1.08</text>
      <text x="150" y="248" font-size="15" font-weight="600" fill="#8B89A0">DIFFICULTY</text>
      <text x="150" y="278" font-size="26" font-weight="700" fill="#A3E635">46</text>
      <text x="278" y="248" font-size="15" font-weight="600" fill="#8B89A0">INTENT</text>
      <text x="278" y="278" font-size="19" font-weight="700" fill="#A3E635">transact.</text>
    </g>
  </g>
</svg>
