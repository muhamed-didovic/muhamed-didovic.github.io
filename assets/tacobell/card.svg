<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Taco Bell Menu Scraper store card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#702082"/><stop offset="1" stop-color="#4A1557"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1105" cy="70" r="230" fill="#E4258F" opacity="0.16"/>
  <circle cx="90" cy="590" r="180" fill="#F3ECF6" opacity="0.07"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="132" font-size="27" font-weight="700" fill="#F0A9D0" letter-spacing="3.4">STORE-LEVEL MENU DATA</text>
    <text x="72" y="216" font-size="66" font-weight="700" fill="#FFFFFF">Taco Bell</text>
    <text x="72" y="288" font-size="66" font-weight="700" fill="#FFFFFF">Menu Scraper</text>
    <rect x="72" y="322" width="104" height="6" rx="3" fill="#E4258F"/>
    <text x="72" y="386" font-size="27" fill="#F3ECF6" opacity="0.92">Paste an address. Get that store's</text>
    <text x="72" y="426" font-size="27" fill="#F3ECF6" opacity="0.92">real menu, prices and calories.</text>
    <g font-size="23" fill="#F3ECF6">
      <circle cx="84" cy="490" r="6" fill="#E4258F"/><text x="106" y="498">Per-store prices, not national averages</text>
      <circle cx="84" cy="536" r="6" fill="#E4258F"/><text x="106" y="544">Calories on every product, every category</text>
      <circle cx="84" cy="582" r="6" fill="#E4258F"/><text x="106" y="590">Address in, ~140 priced products out</text>
    </g>
    <g filter="url(#soft)"><rect x="760" y="150" width="380" height="352" rx="22" fill="#FBF6FC"/></g>
    <text x="792" y="196" font-size="16" font-weight="700" fill="#8A6E90" letter-spacing="1.4">4623 HIGHWAY 280 S · BIRMINGHAM AL</text>
    <text x="792" y="248" font-size="34" font-weight="700" fill="#702082">Chalupa Supreme</text>
    <text x="792" y="282" font-size="19" fill="#8A6E90">Tacos · 350 Cal</text>
    <text x="792" y="352" font-size="52" font-weight="700" fill="#702082">$5.19</text>
    <text x="792" y="380" font-size="18" fill="#8A6E90" letter-spacing="1.2">BIRMINGHAM</text>
    <text x="964" y="352" font-size="36" font-weight="700" fill="#9E7CA6">$6.79</text>
    <text x="964" y="380" font-size="18" fill="#8A6E90" letter-spacing="1.2">TIMES SQ</text>
    <line x1="792" y1="408" x2="1108" y2="408" stroke="#E7D9EC" stroke-width="2"/>
    <g font-size="20" fill="#5F4466"><text x="792" y="444">Soft Taco $1.89 · Nacho Fries $2.69</text><text x="792" y="476">same items, priced per store</text></g>
    <text x="760" y="548" font-size="19" fill="#E0A9CE">US residential proxy · JSON or CSV</text>
  </g>
</svg>
