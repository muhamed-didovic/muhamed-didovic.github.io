<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2C2C2C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE000"/>
      <stop offset="100%" stop-color="#FFC700"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="url(#accentGrad)"/>

  <!-- Left column: text -->
  <g transform="translate(80, 110)">
    <!-- Eyebrow pill -->
    <rect x="0" y="0" width="280" height="44" rx="22" fill="#FFE000"/>
    <text x="140" y="29" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">TURKEY REAL ESTATE SCRAPER</text>

    <!-- Title -->
    <text x="0" y="110" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF">Sahibinden</text>
    <text x="0" y="168" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#FFE000">Listings Scraper</text>

    <!-- Subtitle -->
    <text x="0" y="220" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#CCCCCC">Prices, rooms, GPS, photos, seller info,</text>
    <text x="0" y="250" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#CCCCCC">and phone numbers. All 81 provinces.</text>

    <!-- Feature chips -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="none" stroke="#FFE000" stroke-width="2"/>
      <text x="75" y="25" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFE000" text-anchor="middle">25+ fields</text>

      <rect x="165" y="0" width="170" height="38" rx="19" fill="none" stroke="#FFE000" stroke-width="2"/>
      <text x="250" y="25" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFE000" text-anchor="middle">Phone numbers</text>

      <rect x="0" y="52" width="180" height="38" rx="19" fill="none" stroke="#FFE000" stroke-width="2"/>
      <text x="90" y="77" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFE000" text-anchor="middle">Cloudflare bypass</text>

      <rect x="195" y="52" width="160" height="38" rx="19" fill="none" stroke="#FFE000" stroke-width="2"/>
      <text x="275" y="77" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFE000" text-anchor="middle">JSON or CSV</text>
    </g>

    <!-- URL preview -->
    <text x="0" y="430" font-family="SF Mono, Monaco, monospace" font-size="16" fill="#888">apify.com/memo23/sahibinden-real-estate-listings-scraper</text>
  </g>

  <!-- Right column: house motif -->
  <g transform="translate(880, 180)" filter="url(#cardShadow)">
    <rect x="-140" y="-40" width="280" height="320" rx="24" fill="#FFE000"/>
    <!-- House -->
    <g transform="translate(0, 40)">
      <path d="M -100 0 L 0 -80 L 100 0 L 100 10 L 0 -70 L -100 10 Z" fill="#1a1a1a"/>
      <rect x="-85" y="0" width="170" height="130" rx="6" fill="#1a1a1a"/>
      <rect x="-25" y="60" width="50" height="70" rx="3" fill="#FFE000"/>
      <rect x="-70" y="20" width="40" height="34" rx="2" fill="#FFE000"/>
      <rect x="30" y="20" width="40" height="34" rx="2" fill="#FFE000"/>
    </g>
  </g>
</svg>
