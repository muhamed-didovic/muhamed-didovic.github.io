<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE000"/>
      <stop offset="100%" stop-color="#FFC700"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="72" fill="url(#bgGrad)"/>
  <!-- House motif -->
  <g filter="url(#dropShadow)" transform="translate(256, 230)">
    <!-- roof -->
    <path d="M -130 10 L 0 -90 L 130 10 L 130 20 L 0 -80 L -130 20 Z" fill="#2C2C2C"/>
    <!-- body -->
    <rect x="-110" y="10" width="220" height="150" rx="8" fill="#2C2C2C"/>
    <!-- door -->
    <rect x="-30" y="80" width="60" height="80" rx="4" fill="#FFE000"/>
    <!-- windows -->
    <rect x="-90" y="30" width="50" height="40" rx="3" fill="#FFE000"/>
    <rect x="40" y="30" width="50" height="40" rx="3" fill="#FFE000"/>
  </g>
  <!-- "S" monogram badge -->
  <g transform="translate(256, 410)">
    <text x="0" y="0" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#2C2C2C" text-anchor="middle">sahibinden</text>
  </g>
</svg>
