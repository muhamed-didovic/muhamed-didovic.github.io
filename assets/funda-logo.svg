<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#e64a00"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1e6"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>
  <circle cx="256" cy="160" r="220" fill="#ffffff" opacity="0.10"/>

  <!-- House + roof monogram -->
  <g filter="url(#ds)" transform="translate(256,236)">
    <!-- roof -->
    <path d="M -120 6 L 0 -96 L 120 6 L 96 6 L 0 -70 L -96 6 Z" fill="url(#houseGrad)"/>
    <!-- body -->
    <rect x="-84" y="6" width="168" height="120" rx="10" fill="url(#houseGrad)"/>
    <!-- door -->
    <rect x="-20" y="58" width="40" height="68" rx="6" fill="#e64a00"/>
    <!-- window -->
    <rect x="-64" y="30" width="34" height="34" rx="5" fill="#ff7a1a"/>
    <rect x="30" y="30" width="34" height="34" rx="5" fill="#ff7a1a"/>
  </g>

  <!-- Location pin badge -->
  <g filter="url(#ds)" transform="translate(392,120)">
    <path d="M 0 -46 A 34 34 0 1 1 0 22 A 34 34 0 1 1 0 -46 Z" fill="#ffffff"/>
    <path d="M -22 6 L 0 44 L 22 6 Z" fill="#ffffff"/>
    <circle cx="0" cy="-12" r="14" fill="#e64a00"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="446" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="52" fill="#ffffff" letter-spacing="2">funda.nl</text>
</svg>
