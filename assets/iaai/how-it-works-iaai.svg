<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC24B"/><stop offset="100%" stop-color="#F59A1E"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7E93AC"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#F5F8FB"/>
  <text x="600" y="62" text-anchor="middle" font-size="35" font-weight="800" fill="#0A2340">How the IAAI Scraper Works</text>
  <rect x="534" y="80" width="132" height="5" rx="2.5" fill="url(#amber)"/>

  <!-- STEP 1 -->
  <g filter="url(#sh)">
    <rect x="52" y="126" width="252" height="196" rx="16" fill="#FFFFFF" stroke="#D8E3EE" stroke-width="2"/>
  </g>
  <circle cx="86" cy="160" r="19" fill="#12395E"/>
  <text x="86" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#FFF">1</text>
  <text x="118" y="168" font-size="23" font-weight="700" fill="#0A2340">Seed</text>
  <g font-size="16" fill="#4A6480">
    <text x="76" y="209">Pick categories + makes,</text>
    <text x="76" y="234">or paste your own URLs:</text>
  </g>
  <g font-size="12.5" fill="#12395E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="76" y="266">/Vehiclelisting/Cars/Ford</text>
    <text x="76" y="292">/VehicleDetail/46314273~US</text>
  </g>

  <!-- STEP 2 -->
  <g filter="url(#sh)">
    <rect x="352" y="126" width="252" height="196" rx="16" fill="#FFFFFF" stroke="#D8E3EE" stroke-width="2"/>
  </g>
  <circle cx="386" cy="160" r="19" fill="#12395E"/>
  <text x="386" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#FFF">2</text>
  <text x="418" y="168" font-size="23" font-weight="700" fill="#0A2340">Warm up</text>
  <g font-size="16" fill="#4A6480">
    <text x="376" y="209">Load a listing page first so</text>
    <text x="376" y="233">the edge layer issues its</text>
    <text x="376" y="257">cookies. Lot pages are only</text>
    <text x="376" y="281">served to a warmed session,</text>
    <text x="376" y="305">on a sticky residential IP.</text>
  </g>

  <!-- STEP 3 -->
  <g filter="url(#sh)">
    <rect x="652" y="126" width="252" height="196" rx="16" fill="#FFFFFF" stroke="#D8E3EE" stroke-width="2"/>
  </g>
  <circle cx="686" cy="160" r="19" fill="#12395E"/>
  <text x="686" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#FFF">3</text>
  <text x="718" y="168" font-size="23" font-weight="700" fill="#0A2340">Collect lots</text>
  <g font-size="16" fill="#4A6480">
    <text x="676" y="209">Each listing page yields up</text>
    <text x="676" y="233">to 100 lot links, queued as</text>
    <text x="676" y="257">individual requests carrying</text>
    <text x="676" y="281">the listing page as referer.</text>
  </g>

  <!-- STEP 4 -->
  <g filter="url(#sh)">
    <rect x="952" y="126" width="200" height="196" rx="16" fill="#FFFFFF" stroke="#D8E3EE" stroke-width="2"/>
  </g>
  <circle cx="986" cy="160" r="19" fill="#12395E"/>
  <text x="986" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#FFF">4</text>
  <text x="1018" y="168" font-size="23" font-weight="700" fill="#0A2340">Parse</text>
  <g font-size="16" fill="#4A6480">
    <text x="976" y="209">Read the lot's own</text>
    <text x="976" y="233">structured record,</text>
    <text x="976" y="257">not the rendered</text>
    <text x="976" y="281">HTML.</text>
  </g>

  <line x1="312" y1="224" x2="344" y2="224" stroke="#7E93AC" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="612" y1="224" x2="644" y2="224" stroke="#7E93AC" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="912" y1="224" x2="944" y2="224" stroke="#7E93AC" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- WHY IT MATTERS -->
  <g filter="url(#sh)">
    <rect x="52" y="360" width="536" height="152" rx="16" fill="#0A2340"/>
  </g>
  <text x="80" y="400" font-size="20" font-weight="700" fill="#FFC24B">Why read the record, not the page?</text>
  <g font-size="16" fill="#C7D8E9">
    <text x="80" y="432">Most values on an IAAI lot page are filled in by the</text>
    <text x="80" y="456">browser, so they are blank in the HTML source. Selector-</text>
    <text x="80" y="480">based scrapers return empty damage, keys and engine</text>
    <text x="80" y="500">columns. Reading the underlying record returns all of them.</text>
  </g>

  <!-- STEP 5 / VIN -->
  <g filter="url(#sh)">
    <rect x="620" y="360" width="532" height="152" rx="16" fill="#FFFFFF" stroke="#D8E3EE" stroke-width="2"/>
  </g>
  <circle cx="654" cy="394" r="19" fill="#12395E"/>
  <text x="654" y="402" text-anchor="middle" font-size="21" font-weight="700" fill="#FFF">5</text>
  <text x="686" y="402" font-size="23" font-weight="700" fill="#0A2340">Decode the masked VIN (optional)</text>
  <g transform="translate(700 448)">
    <rect x="-56" y="-21" width="252" height="42" rx="10" fill="#0A2340"/>
    <text x="70" y="8" text-anchor="middle" font-size="21" font-weight="700" fill="#FFC24B" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1FTFW1EV3AK******</text>
  </g>
  <text x="920" y="443" font-size="15.5" fill="#4A6480">IAAI hides the last six. The</text>
  <text x="920" y="465" font-size="15.5" fill="#4A6480">eleven shown still decode to</text>
  <text x="920" y="487" font-size="15.5" fill="#4A6480">make, plant, year and engine.</text>

  <!-- OUTPUT -->
  <g filter="url(#sh)">
    <rect x="52" y="552" width="1100" height="126" rx="16" fill="#FFFFFF" stroke="#D8E3EE" stroke-width="2"/>
  </g>
  <text x="80" y="592" font-size="21" font-weight="700" fill="#0A2340">One flat row per lot &#183; 200+ fields</text>
  <g font-size="15.5" fill="#4A6480">
    <text x="80" y="626">Year &#183; Make &#183; Model &#183; VIN &#183; PrimaryDamageDesc &#183; LossTypeDesc &#183; StartsDesc &#183; Keys &#183; AirbagState &#183; ODOValue</text>
    <text x="80" y="654">TitleStateName &#183; BranchName &#183; Address &#183; Phone &#183; LocLatitude &#183; LocLongitude &#183; AuctionDateTime &#183; Lane &#183; Slot</text>
  </g>
</svg>
