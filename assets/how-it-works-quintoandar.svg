<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff6f4"/><stop offset="100%" stop-color="#ffe4de"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8503a"/><stop offset="100%" stop-color="#b33224"/></linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#b33224" flood-opacity="0.20"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="44" fill="#2a110d">How the QuintoAndar Scraper works</text>
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="23" fill="#6e2b20">A city or a search link in · one flat row per property out</text>
  <g transform="translate(70,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#brand)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">1</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#2a110d">Input</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6e2b20">
      <text x="30" y="204">• Locations</text>
      <text x="30" y="244">• Search URLs</text>
      <text x="30" y="284">• rent / buy</text>
      <text x="30" y="324">• Price &amp; bedrooms</text>
    </g>
  </g>
  <g transform="translate(450,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#brand)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">2</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#2a110d">Collect</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6e2b20">
      <text x="30" y="204">• Every result page</text>
      <text x="30" y="244">• Property detail</text>
      <text x="30" y="284">• Area &amp; rooms</text>
      <text x="30" y="324">• Neighborhood</text>
    </g>
  </g>
  <g transform="translate(830,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#brand)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">3</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#2a110d">Emit</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6e2b20">
      <text x="30" y="204">• rentPrice · salePrice</text>
      <text x="30" y="244">• totalCost · area</text>
      <text x="30" y="284">• bedrooms · parking</text>
      <text x="30" y="324">• JSON · CSV · Excel</text>
    </g>
  </g>
  <path d="M386 390 l44 0 m-12 -11 l12 11 l-12 11" stroke="#b33224" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M766 390 l44 0 m-12 -11 l12 11 l-12 11" stroke="#b33224" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <text x="600" y="662" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="19" fill="#6e2b20">One flat row per record · pay only for rows you keep</text>
</svg>
