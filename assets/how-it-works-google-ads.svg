<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#174ea6" flood-opacity="0.14"/>
    </filter>
    <style><![CDATA[
      .title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 500; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 500; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
      .badge-num { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; }
      .mono { font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace; font-weight: 400; }
      .foot { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; }
    ]]></style>
  </defs>
  <rect width="1200" height="720" fill="url(#bgGrad)"/>
  <text x="600" y="60" text-anchor="middle" class="title" font-size="30" fill="#202124">How the Google Ads Transparency Scraper Works</text>
  <text x="600" y="92" text-anchor="middle" class="subtitle" font-size="16" fill="#1a73e8">Domain / AR id &#8594; Transparency Center &#8594; one row per creative</text>
  <g>
    <line x1="385" y1="410" x2="432" y2="410" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
    <polygon points="432,410 419,404 419,416" fill="#4285F4"/>
  </g>
  <g>
    <line x1="768" y1="410" x2="815" y2="410" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
    <polygon points="815,410 802,404 802,416" fill="#4285F4"/>
  </g>
  <g>
    <rect x="50" y="140" width="335" height="510" rx="16" fill="#ffffff" stroke="#c4d7f5" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="88" cy="180" r="20" fill="url(#badgeGrad)"/>
    <text x="88" y="188" text-anchor="middle" class="badge-num" font-size="20" fill="#ffffff">1</text>
    <text x="122" y="180" class="card-title" font-size="23" fill="#202124">Input</text>
    <text x="122" y="200" class="card-sub" font-size="13" fill="#5f6368">Domain, AR id, or Center URL</text>
    <rect x="74" y="224" width="287" height="56" rx="10" fill="#e8f0fe" stroke="#c4d7f5" stroke-width="1"/>
    <text x="90" y="248" class="label" font-size="14" fill="#202124">Advertiser domain</text>
    <text x="90" y="269" class="small" font-size="12" fill="#5f6368">temu.com &#183; nike.com</text>
    <rect x="74" y="290" width="287" height="56" rx="10" fill="#e8f0fe" stroke="#c4d7f5" stroke-width="1"/>
    <text x="90" y="314" class="label" font-size="14" fill="#202124">Advertiser ID</text>
    <text x="90" y="335" class="mono" font-size="11" fill="#1a73e8">AR13288476527828631553</text>
    <rect x="74" y="356" width="287" height="56" rx="10" fill="#e8f0fe" stroke="#c4d7f5" stroke-width="1"/>
    <text x="90" y="380" class="label" font-size="14" fill="#202124">Filters</text>
    <text x="90" y="401" class="small" font-size="12" fill="#5f6368">region &#183; format &#183; date range</text>
    <text x="74" y="480" class="label" font-size="13" fill="#202124">Not supported</text>
    <text x="74" y="504" class="small" font-size="12" fill="#5f6368">Free-text advertiser name search</text>
    <text x="74" y="526" class="small" font-size="12" fill="#5f6368">Logged-in Google accounts</text>
    <text x="74" y="548" class="small" font-size="12" fill="#5f6368">Spend or click totals (not public)</text>
  </g>
  <g>
    <rect x="433" y="140" width="335" height="510" rx="16" fill="#ffffff" stroke="#c4d7f5" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="471" cy="180" r="20" fill="url(#badgeGrad)"/>
    <text x="471" y="188" text-anchor="middle" class="badge-num" font-size="20" fill="#ffffff">2</text>
    <text x="505" y="180" class="card-title" font-size="23" fill="#202124">Fetch</text>
    <text x="505" y="200" class="card-sub" font-size="13" fill="#5f6368">Public Transparency Center</text>
    <g transform="translate(457, 224)">
      <rect width="287" height="256" rx="12" fill="#202124"/>
      <text x="20" y="40" class="label" font-size="13" fill="#ffffff">1. Resolve advertiser</text>
      <text x="20" y="60" class="small" font-size="11" fill="#8ab4f8">domain or AR id</text>
      <text x="20" y="100" class="label" font-size="13" fill="#ffffff">2. Page creatives</text>
      <text x="20" y="120" class="small" font-size="11" fill="#8ab4f8">IMAGE / VIDEO / TEXT</text>
      <text x="20" y="160" class="label" font-size="13" fill="#ffffff">3. Read each ad</text>
      <text x="20" y="180" class="small" font-size="11" fill="#8ab4f8">copy, landing, regions</text>
      <text x="20" y="220" class="label" font-size="13" fill="#ffffff">4. Optional assets</text>
      <text x="20" y="240" class="small" font-size="11" fill="#8ab4f8">bytes into your KV store</text>
    </g>
    <rect x="457" y="510" width="287" height="110" rx="10" fill="#e8f0fe" stroke="#c4d7f5" stroke-width="1"/>
    <text x="471" y="538" class="label" font-size="13" fill="#1a73e8">Pay per ad written</text>
    <text x="471" y="562" class="small" font-size="12" fill="#5f6368">No monthly rental on this listing</text>
    <text x="471" y="584" class="small" font-size="12" fill="#5f6368">Failed pages are not billed</text>
  </g>
  <g>
    <rect x="816" y="140" width="335" height="510" rx="16" fill="#ffffff" stroke="#c4d7f5" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="854" cy="180" r="20" fill="url(#badgeGrad)"/>
    <text x="854" y="188" text-anchor="middle" class="badge-num" font-size="20" fill="#ffffff">3</text>
    <text x="888" y="180" class="card-title" font-size="23" fill="#202124">Emit</text>
    <text x="888" y="200" class="card-sub" font-size="13" fill="#5f6368">One row per creative</text>
    <g transform="translate(840, 224)">
      <rect width="287" height="390" rx="12" fill="#202124"/>
      <text x="16" y="30" class="mono" font-size="12" fill="#e8f0fe">{</text>
      <text x="16" y="50" class="mono" font-size="12" fill="#e8f0fe">  format: "IMAGE",</text>
      <text x="16" y="70" class="mono" font-size="12" fill="#8ab4f8">  advertiserName:</text>
      <text x="16" y="90" class="mono" font-size="12" fill="#8ab4f8">    "Temu",</text>
      <text x="16" y="110" class="mono" font-size="12" fill="#e8f0fe">  advertiserDomain:</text>
      <text x="16" y="130" class="mono" font-size="12" fill="#e8f0fe">    "temu.com",</text>
      <text x="16" y="150" class="mono" font-size="12" fill="#e8f0fe">  firstShown: "...",</text>
      <text x="16" y="170" class="mono" font-size="12" fill="#e8f0fe">  lastShown: "...",</text>
      <text x="16" y="190" class="mono" font-size="12" fill="#7fe0a8">  adLink: "https://...",</text>
      <text x="16" y="210" class="mono" font-size="12" fill="#e8f0fe">  creativeId: "CR...",</text>
      <text x="16" y="230" class="mono" font-size="12" fill="#e8f0fe">  advertiserId: "AR...",</text>
      <text x="16" y="250" class="mono" font-size="12" fill="#e8f0fe">  regionStats: [...]</text>
      <text x="16" y="270" class="mono" font-size="12" fill="#e8f0fe">}</text>
    </g>
  </g>
  <text x="600" y="690" text-anchor="middle" class="foot" font-size="14" fill="#1a73e8">Pay per ad &#183; no Google login &#183; public Transparency Center only</text>
</svg>
