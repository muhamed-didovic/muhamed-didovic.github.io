<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Face: light from the top-left, deepening to the bottom-right. This single
         gradient does most of the "raised" reading; the highlights below only
         sharpen it. -->
    <linearGradient id="face" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#8f74ff"/>
      <stop offset="55%"  stop-color="#6b45f5"/>
      <stop offset="100%" stop-color="#3d1bb0"/>
    </linearGradient>

    <!-- Gloss: a soft sheen over the top third, fading out before the middle so
         it never looks like a stripe. -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="38%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- The tile floats: a wide, soft shadow plus a tighter contact shadow.
         Two shadows rather than one is what stops it looking like a blur. -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#241a40" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="6"  stdDeviation="6"  flood-color="#241a40" flood-opacity="0.26"/>
    </filter>

    <!-- The glyph sits ON the tile, so it casts its own small shadow. -->
    <filter id="emboss" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#2a0f7a" flood-opacity="0.45"/>
    </filter>

    <clipPath id="tile">
      <rect x="40" y="30" width="432" height="432" rx="104"/>
    </clipPath>
  </defs>

  <g filter="url(#lift)">
    <rect x="40" y="30" width="432" height="432" rx="104" fill="url(#face)"/>
    <g clip-path="url(#tile)">
      <rect x="40" y="30" width="432" height="432" fill="url(#gloss)"/>
      <!-- Top rim catching the light, and a dark bottom rim. The pair is the
           bevel: without the dark edge the tile reads flat however bright the
           highlight is. -->
      <rect x="40" y="30" width="432" height="432" rx="104" fill="none"
            stroke="#ffffff" stroke-opacity="0.42" stroke-width="3"/>
      <rect x="40" y="36" width="432" height="432" rx="104" fill="none"
            stroke="#1a0a52" stroke-opacity="0.35" stroke-width="5"/>
    </g>
  </g>

  <g filter="url(#emboss)">
    <!-- Speech bubble: the actor returns what the AI said. Sized to leave a
         clear margin inside the tile -- a glyph that crowds the corners loses
         the rounded-square silhouette the whole style depends on. -->
    <path d="M156 146 h196 q30 0 30 30 v122 q0 30 -30 30 h-96 l-58 48 v-48 h-42 q-30 0 -30 -30 v-122 q0 -30 30 -30 z" fill="#ffffff"/>
    <g stroke="#5b35e0" stroke-width="22" stroke-linecap="round">
      <line x1="192" y1="200" x2="312" y2="200"/>
      <line x1="192" y1="243" x2="342" y2="243"/>
      <line x1="192" y1="286" x2="282" y2="286"/>
    </g>
    <!-- Sparkle marks it AI-generated rather than a quote. Clear of the tail, so
         the two never merge into one blob at listing size. -->
    <path d="M372 322 l15 41 l41 15 l-41 15 l-15 41 l-15 -41 l-41 -15 l41 -15 z" fill="#ffffff"/>
  </g>
</svg>
