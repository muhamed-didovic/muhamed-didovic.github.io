<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f5fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b3d91" flood-opacity="0.10"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0b3d91" flood-opacity="0.30"/>
    </filter>
    <style><![CDATA[
      .title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 500; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
      .badge-num { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .mono { font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace; font-weight: 400; }
    ]]></style>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <text x="800" y="92" text-anchor="middle" class="title" font-size="44" fill="#174ea6">How Google Trends Scraper Works</text>
  <text x="800" y="138" text-anchor="middle" class="subtitle" font-size="22" fill="#5a6b8c">From search terms to structured trend data — straight from the Trends JSON API, no browser</text>
  <line x1="640" y1="170" x2="960" y2="170" stroke="#d7e3f8" stroke-width="2"/>

  <!-- ARROWS -->
  <g>
    <line x1="540" y1="490" x2="586" y2="490" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="586,490 574,484 574,496" fill="#1a73e8"/>
  </g>
  <g>
    <line x1="1033" y1="490" x2="1079" y2="490" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="1079,490 1067,484 1067,496" fill="#1a73e8"/>
  </g>

  <!-- ============= COLUMN 1: INPUT ============= -->
  <g>
    <rect x="80" y="220" width="453" height="540" rx="16" fill="#ffffff" stroke="#d7e3f8" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="120" cy="260" r="22" fill="#174ea6" filter="url(#badgeShadow)"/>
    <text x="120" y="268" text-anchor="middle" class="badge-num" font-size="22" fill="#ffffff">1</text>
    <text x="160" y="268" class="card-title" font-size="26" fill="#174ea6">Input</text>

    <rect x="110" y="316" width="393" height="62" rx="10" fill="#f0f5fe" stroke="#d7e3f8" stroke-width="1"/>
    <circle cx="138" cy="347" r="14" fill="#1a73e8"/>
    <path d="M 134 347 L 138 351 L 144 343" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="166" y="343" class="label" font-size="15" fill="#174ea6">Search terms</text>
    <text x="166" y="365" class="small mono" font-size="12" fill="#6f7d99">"bitcoin" · "chatgpt" · /m/topic-ids</text>

    <rect x="110" y="394" width="393" height="62" rx="10" fill="#f0f5fe" stroke="#d7e3f8" stroke-width="1"/>
    <circle cx="138" cy="425" r="14" fill="#1a73e8"/>
    <path d="M 134 425 L 138 429 L 144 421" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="166" y="421" class="label" font-size="15" fill="#174ea6">Locations + time range</text>
    <text x="166" y="443" class="small mono" font-size="12" fill="#6f7d99">US · GB · US-CA · worldwide · 1h → 2004+</text>

    <text x="110" y="500" class="small" font-size="13" fill="#5a6b8c">DATA TYPES</text>

    <g font-size="12" class="label" fill="#174ea6">
      <rect x="110" y="514" width="170" height="28" rx="14" fill="#e8f0fe" stroke="#c6d9f7" stroke-width="1"/>
      <text x="195" y="533" text-anchor="middle">Interest over time</text>
      <rect x="288" y="514" width="170" height="28" rx="14" fill="#e8f0fe" stroke="#c6d9f7" stroke-width="1"/>
      <text x="373" y="533" text-anchor="middle">Interest by region</text>

      <rect x="110" y="550" width="160" height="28" rx="14" fill="#e8f0fe" stroke="#c6d9f7" stroke-width="1"/>
      <text x="190" y="569" text-anchor="middle">Related queries</text>
      <rect x="278" y="550" width="180" height="28" rx="14" fill="#e8f0fe" stroke="#c6d9f7" stroke-width="1"/>
      <text x="368" y="569" text-anchor="middle">Trending Now feed</text>
    </g>

    <text x="110" y="625" class="small" font-size="13" fill="#5a6b8c">MODES</text>
    <g font-size="12" class="label" fill="#174ea6">
      <rect x="110" y="639" width="200" height="28" rx="14" fill="#e8f0fe" stroke="#c6d9f7" stroke-width="1"/>
      <text x="210" y="658" text-anchor="middle">Compare up to 5 terms</text>
      <rect x="318" y="639" width="150" height="28" rx="14" fill="#e8f0fe" stroke="#c6d9f7" stroke-width="1"/>
      <text x="393" y="658" text-anchor="middle">Web · News · YT</text>
    </g>

    <line x1="110" y1="688" x2="503" y2="688" stroke="#eaf1fc" stroke-width="1"/>
    <text x="306" y="715" text-anchor="middle" class="small" font-size="13" fill="#5a6b8c">Any mix: terms × locations × data types in one run</text>
  </g>

  <!-- ============= COLUMN 2: PROCESSING ============= -->
  <g>
    <rect x="573" y="220" width="453" height="540" rx="16" fill="#ffffff" stroke="#d7e3f8" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="613" cy="260" r="22" fill="#174ea6" filter="url(#badgeShadow)"/>
    <text x="613" y="268" text-anchor="middle" class="badge-num" font-size="22" fill="#ffffff">2</text>
    <text x="653" y="268" class="card-title" font-size="26" fill="#174ea6">Processing</text>

    <g class="label" font-size="15" fill="#174ea6">
      <circle cx="615" cy="335" r="11" fill="#1a73e8"/>
      <text x="615" y="340" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">a</text>
      <text x="640" y="340">Open a Trends session (cookie dance)</text>
      <line x1="615" y1="346" x2="615" y2="372" stroke="#c6d9f7" stroke-width="2"/>

      <circle cx="615" cy="385" r="11" fill="#1a73e8"/>
      <text x="615" y="390" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">b</text>
      <text x="640" y="390">explore → per-widget API tokens</text>
      <line x1="615" y1="396" x2="615" y2="422" stroke="#c6d9f7" stroke-width="2"/>

      <circle cx="615" cy="435" r="11" fill="#1a73e8"/>
      <text x="615" y="440" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">c</text>
      <text x="640" y="440">Fetch timeline · regions · queries</text>
      <line x1="615" y1="446" x2="615" y2="472" stroke="#c6d9f7" stroke-width="2"/>

      <circle cx="615" cy="485" r="11" fill="#1a73e8"/>
      <text x="615" y="490" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">d</text>
      <text x="640" y="490">Trending Now via live RPC feed</text>
      <line x1="615" y1="496" x2="615" y2="522" stroke="#c6d9f7" stroke-width="2"/>

      <circle cx="615" cy="535" r="11" fill="#1a73e8"/>
      <text x="615" y="540" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">e</text>
      <text x="640" y="540">Push structured rows to dataset</text>
    </g>

    <text x="603" y="600" class="small" font-size="13" fill="#5a6b8c">PIPELINE</text>
    <g font-size="12" class="label">
      <rect x="603" y="614" width="166" height="28" rx="14" fill="#e6f4ea" stroke="#b7dfc2" stroke-width="1"/>
      <text x="686" y="633" text-anchor="middle" fill="#137333">impit + sliding window</text>

      <rect x="777" y="614" width="170" height="28" rx="14" fill="#e6f4ea" stroke="#b7dfc2" stroke-width="1"/>
      <text x="862" y="633" text-anchor="middle" fill="#137333">residential proxies</text>

      <rect x="603" y="650" width="160" height="28" rx="14" fill="#e8f0fe" stroke="#c6d9f7" stroke-width="1"/>
      <text x="683" y="669" text-anchor="middle" fill="#174ea6">native JSON API</text>

      <rect x="771" y="650" width="180" height="28" rx="14" fill="#e8f0fe" stroke="#c6d9f7" stroke-width="1"/>
      <text x="861" y="669" text-anchor="middle" fill="#174ea6">retry on fresh session</text>
    </g>

    <line x1="603" y1="688" x2="996" y2="688" stroke="#eaf1fc" stroke-width="1"/>
    <text x="799" y="715" text-anchor="middle" class="small" font-size="13" fill="#5a6b8c">No browser · no Playwright · pure HTTP speed</text>
  </g>

  <!-- ============= COLUMN 3: OUTPUT ============= -->
  <g>
    <rect x="1066" y="220" width="453" height="540" rx="16" fill="#ffffff" stroke="#d7e3f8" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="1106" cy="260" r="22" fill="#174ea6" filter="url(#badgeShadow)"/>
    <text x="1106" y="268" text-anchor="middle" class="badge-num" font-size="22" fill="#ffffff">3</text>
    <text x="1146" y="268" class="card-title" font-size="26" fill="#174ea6">Output</text>

    <rect x="1096" y="316" width="393" height="318" rx="12" fill="#0b1c36" stroke="#174ea6" stroke-width="1"/>
    <text x="1116" y="343" class="mono" font-size="13" fill="#8ab4f8">dataType:</text>
    <text x="1196" y="343" class="mono" font-size="13" fill="#fdd663">"interestOverTime"</text>

    <text x="1116" y="364" class="mono" font-size="13" fill="#8ab4f8">keyword:</text>
    <text x="1188" y="364" class="mono" font-size="13" fill="#ffffff">"bitcoin"</text>

    <text x="1116" y="385" class="mono" font-size="13" fill="#8ab4f8">geo:</text>
    <text x="1152" y="385" class="mono" font-size="13" fill="#ffffff">"US"</text>

    <text x="1116" y="406" class="mono" font-size="13" fill="#8ab4f8">timeRange:</text>
    <text x="1204" y="406" class="mono" font-size="13" fill="#ffffff">"today 12-m"</text>

    <text x="1116" y="427" class="mono" font-size="13" fill="#8ab4f8">timeline:</text>
    <text x="1190" y="427" class="mono" font-size="13" fill="#ffffff">[54 weekly points 0–100]</text>

    <text x="1116" y="448" class="mono" font-size="13" fill="#8ab4f8">regions:</text>
    <text x="1184" y="448" class="mono" font-size="13" fill="#ffffff">[51 states, WY = 100]</text>

    <text x="1116" y="469" class="mono" font-size="13" fill="#8ab4f8">relatedQueries.top:</text>
    <text x="1268" y="469" class="mono" font-size="13" fill="#ffffff">[25 items]</text>

    <text x="1116" y="490" class="mono" font-size="13" fill="#8ab4f8">relatedQueries.rising:</text>
    <text x="1288" y="490" class="mono" font-size="13" fill="#ffffff">[25 items]</text>

    <text x="1116" y="518" class="mono" font-size="13" fill="#8ab4f8">trendingNow:</text>
    <text x="1220" y="518" class="mono" font-size="13" fill="#fdd663">"world cup final"</text>

    <text x="1116" y="539" class="mono" font-size="13" fill="#8ab4f8">searchVolume:</text>
    <text x="1228" y="539" class="mono" font-size="13" fill="#ffffff">1M+ · growth +300%</text>

    <text x="1116" y="560" class="mono" font-size="13" fill="#8ab4f8">relatedQueries:</text>
    <text x="1240" y="560" class="mono" font-size="13" fill="#ffffff">[57 live queries]</text>

    <text x="1116" y="595" class="mono" font-size="11" fill="#6f88b8">// one row per term × geo × data type</text>

    <g font-size="12" class="label" fill="#ffffff">
      <rect x="1096" y="650" width="64" height="28" rx="14" fill="#174ea6"/>
      <text x="1128" y="669" text-anchor="middle">JSON</text>
      <rect x="1168" y="650" width="64" height="28" rx="14" fill="#174ea6"/>
      <text x="1200" y="669" text-anchor="middle">CSV</text>
      <rect x="1240" y="650" width="100" height="28" rx="14" fill="#174ea6"/>
      <text x="1290" y="669" text-anchor="middle">Apify Dataset</text>
    </g>

    <line x1="1096" y1="688" x2="1489" y2="688" stroke="#eaf1fc" stroke-width="1"/>
    <text x="1292" y="715" text-anchor="middle" class="small" font-size="13" fill="#5a6b8c">Interest 0–100 · regions · related queries · live trends</text>
  </g>

  <!-- BOTTOM STRIP -->
  <rect x="80" y="800" width="1440" height="56" rx="12" fill="#174ea6"/>
  <text x="800" y="836" text-anchor="middle" class="label" font-size="18" fill="#ffffff">Native JSON API · Interest over time · Regions · Related queries · Live Trending Now · Compare mode</text>
</svg>
