<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff5f6"/><stop offset="100%" stop-color="#ffe2e5"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ea1d2c"/><stop offset="100%" stop-color="#a5101c"/></linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#a5101c" flood-opacity="0.20"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="44" fill="#20100f">How the iFood Scraper works</text>
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="23" fill="#6b1a21">A city or a restaurant URL in · menus, reviews and CNPJ out</text>
  <g transform="translate(70,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#brand)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">1</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#20100f">Input</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6b1a21">
      <text x="30" y="204">• Restaurant URL</text>
      <text x="30" y="244">• City or address</text>
      <text x="30" y="284">• Search query</text>
      <text x="30" y="324">• Max restaurants</text>
    </g>
  </g>
  <g transform="translate(450,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#brand)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">2</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#20100f">Collect</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6b1a21">
      <text x="30" y="204">• Restaurant list</text>
      <text x="30" y="244">• Full menu</text>
      <text x="30" y="284">• Reviews</text>
      <text x="30" y="324">• CNPJ, address &amp; phone</text>
    </g>
  </g>
  <g transform="translate(830,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#brand)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">3</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#20100f">Emit</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6b1a21">
      <text x="30" y="204">• rating · reviewsCount</text>
      <text x="30" y="244">• deliveryFee</text>
      <text x="30" y="284">• cnpj · phone</text>
      <text x="30" y="324">• JSON · CSV · Excel</text>
    </g>
  </g>
  <path d="M386 390 l44 0 m-12 -11 l12 11 l-12 11" stroke="#a5101c" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M766 390 l44 0 m-12 -11 l12 11 l-12 11" stroke="#a5101c" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <text x="600" y="662" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="19" fill="#6b1a21">One flat row per record · ready for your sheet, database or agent</text>
</svg>
