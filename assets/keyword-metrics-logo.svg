<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#322A52"/>
      <stop offset="100%" stop-color="#1B152A"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <g fill="#FFFFFF" opacity="0.05">
    <circle cx="96" cy="96" r="5"/><circle cx="176" cy="96" r="5"/><circle cx="256" cy="96" r="5"/>
    <circle cx="96" cy="416" r="5"/><circle cx="416" cy="176" r="5"/><circle cx="416" cy="416" r="5"/>
  </g>

  <!-- search-volume bars: the metric this actor sells -->
  <g filter="url(#ds)">
    <rect x="118" y="316" width="46" height="78"  rx="12" fill="#A8A7B7" opacity="0.5"/>
    <rect x="180" y="278" width="46" height="116" rx="12" fill="#A8A7B7" opacity="0.7"/>
    <rect x="242" y="232" width="46" height="162" rx="12" fill="url(#green)"/>
  </g>

  <!-- magnifier: the "keyword" half of keyword metrics -->
  <g filter="url(#ds)">
    <circle cx="332" cy="196" r="70" fill="none" stroke="url(#green)" stroke-width="20"/>
    <line x1="381" y1="245" x2="424" y2="288" stroke="url(#green)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="332" cy="196" r="70" fill="#0E0B16" opacity="0.35"/>
    <!-- trend line inside the lens -->
    <polyline points="296,220 318,196 340,206 370,168" fill="none" stroke="#A3E635"
              stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
