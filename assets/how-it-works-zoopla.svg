<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1a6e"/>
      <stop offset="100%" stop-color="#1a0b33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f5fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8e44c4"/>
      <stop offset="100%" stop-color="#5b1fa0"/>
    </linearGradient>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44c4"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <g opacity="0.07">
    <circle cx="1100" cy="60" r="180" fill="none" stroke="#c39bd3" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="100" cy="660" r="180" fill="none" stroke="#c39bd3" stroke-width="2" stroke-dasharray="6 8"/>
  </g>

  <text x="600" y="62" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="34" fill="#ffffff">How the Zoopla Scraper works</text>
  <text x="600" y="96" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="17" fill="#d2b4de">Town / postcode or a Zoopla URL - listings, sold prices, agents.</text>

  <g transform="translate(50, 150)" filter="url(#ds)">
    <rect width="320" height="450" rx="18" fill="url(#card)" stroke="#8e44c4" stroke-width="2"/>
    <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="800" font-size="20" fill="#1a0b33">1 - Input</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="500" font-size="13" fill="#5d4e75">No URL required</text>

    <g transform="translate(20, 84)">
      <rect width="280" height="36" rx="8" fill="#f5eef8" stroke="#5b1fa0" stroke-width="1"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#1a0b33">London - NW3 - Oxfordshire</text>
    </g>
    <g transform="translate(20, 128)">
      <rect width="280" height="36" rx="8" fill="#f5eef8" stroke="#5b1fa0" stroke-width="1"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#1a0b33">for-sale / to-rent / new-homes</text>
    </g>
    <g transform="translate(20, 172)">
      <rect width="280" height="36" rx="8" fill="#f5eef8" stroke="#5b1fa0" stroke-width="1"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#1a0b33">sold - house-prices pages</text>
    </g>
    <g transform="translate(20, 216)">
      <rect width="280" height="36" rx="8" fill="#f5eef8" stroke="#5b1fa0" stroke-width="1"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#1a0b33">find-agents / instant agent DB</text>
    </g>
    <g transform="translate(20, 260)">
      <rect width="280" height="36" rx="8" fill="#f5eef8" stroke="#5b1fa0" stroke-width="1"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" fill="#1a0b33">or paste a zoopla.co.uk URL</text>
    </g>

    <text x="20" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="700" font-size="14" fill="#1a0b33">Filters on location search</text>
    <text x="20" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="13" fill="#3a4a6a">Beds, price, radius - only for</text>
    <text x="20" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="13" fill="#3a4a6a">sale / rent / new-homes queries.</text>
    <text x="20" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="700" font-size="14" fill="#1a0b33">URLs keep their own path.</text>
    <text x="20" y="434" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#5b1fa0" font-weight="700">"London" - /for-sale/property/london/</text>
  </g>

  <line x1="380" y1="370" x2="430" y2="370" stroke="#8e44c4" stroke-width="3" marker-end="url(#arr)"/>

  <g transform="translate(440, 150)" filter="url(#ds)">
    <rect width="320" height="450" rx="18" fill="url(#card)" stroke="#8e44c4" stroke-width="2"/>
    <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="800" font-size="20" fill="#1a0b33">2 - Fetch &amp; parse</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="500" font-size="13" fill="#5d4e75">HTTP - mobile API - GraphQL</text>

    <g transform="translate(20, 84)">
      <rect width="280" height="44" rx="10" fill="#1a0b33"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-weight="800" font-size="13" fill="#ffffff">Zoopla mobile search API</text>
      <text x="14" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-weight="500" font-size="11" fill="#d2b4de">Paginate until maxItems</text>
    </g>

    <g transform="translate(20, 138)">
      <rect width="280" height="42" rx="10" fill="#e8f5e8" stroke="#2e7d32" stroke-width="1.5"/>
      <circle cx="20" cy="21" r="9" fill="#2e7d32"/>
      <path d="M15.5 21 L18.5 24 L25 16.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-weight="800" font-size="12" fill="#1a5a1a">Listing GraphQL details</text>
      <text x="38" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-size="11" fill="#1a5a1a">Price, beds, branch, UPRN</text>
    </g>

    <text x="20" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="700" font-size="14" fill="#1a0b33">Optional add-ons:</text>

    <g transform="translate(20, 222)">
      <rect width="280" height="34" rx="8" fill="#f5eef8"/>
      <circle cx="20" cy="17" r="5" fill="url(#accent)"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-weight="700" font-size="12" fill="#1a0b33">UPRN price history</text>
    </g>
    <g transform="translate(20, 264)">
      <rect width="280" height="34" rx="8" fill="#f5eef8"/>
      <circle cx="20" cy="17" r="5" fill="url(#accent)"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-weight="700" font-size="12" fill="#1a0b33">Public agent email lookup</text>
    </g>
    <g transform="translate(20, 306)">
      <rect width="280" height="34" rx="8" fill="#f5eef8"/>
      <circle cx="20" cy="17" r="5" fill="url(#accent)"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-weight="700" font-size="12" fill="#1a0b33">Instant stored agent DB</text>
    </g>

    <text x="20" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="700" font-size="14" fill="#1a0b33">maxItems is a hard cap</text>
    <text x="20" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="13" fill="#3a4a6a">Queued details are not pushed</text>
    <text x="20" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="13" fill="#3a4a6a">once the slot count is hit.</text>
    <text x="20" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="700" font-size="13" fill="#5b1fa0">Residential proxy on live crawls</text>
  </g>

  <line x1="770" y1="370" x2="820" y2="370" stroke="#8e44c4" stroke-width="3" marker-end="url(#arr)"/>

  <g transform="translate(830, 150)" filter="url(#ds)">
    <rect width="320" height="450" rx="18" fill="url(#card)" stroke="#8e44c4" stroke-width="2"/>
    <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="800" font-size="20" fill="#1a0b33">3 - Emit rows</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="500" font-size="13" fill="#5d4e75">One dataset row per result</text>

    <g transform="translate(20, 84)">
      <rect width="280" height="38" rx="8" fill="#f5eef8" stroke="#5b1fa0" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="url(#accent)"/>
      <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-weight="800" font-size="12" fill="#1a0b33">listing</text>
      <text x="38" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-size="11" fill="#3a4a6a">sale / rent / new-home detail</text>
    </g>
    <g transform="translate(20, 132)">
      <rect width="280" height="38" rx="8" fill="#f5eef8" stroke="#5b1fa0" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="url(#accent)"/>
      <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-weight="800" font-size="12" fill="#1a0b33">sold / house-prices</text>
      <text x="38" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-size="11" fill="#3a4a6a">1 row per UPRN property</text>
    </g>
    <g transform="translate(20, 180)">
      <rect width="280" height="38" rx="8" fill="#f5eef8" stroke="#5b1fa0" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="url(#accent)"/>
      <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-weight="800" font-size="12" fill="#1a0b33">agent branch</text>
      <text x="38" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
            font-size="11" fill="#3a4a6a">directory or instant DB</text>
    </g>

    <text x="20" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="700" font-size="14" fill="#1a0b33">Typical listing fields</text>
    <g transform="translate(20, 264)">
      <rect width="280" height="114" rx="10" fill="#1a0b33"/>
      <text x="14" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" fill="#aed581">{ listingId, title,</text>
      <text x="14" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" fill="#e0e0e0">  pricing.valueLabel,</text>
      <text x="14" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" fill="#e0e0e0">  counts.numBedrooms,</text>
      <text x="14" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" fill="#d2b4de">  branch.phone, location.uprn,</text>
      <text x="14" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" fill="#ce93d8">  contactEmail? }</text>
      <text x="14" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" fill="#aed581">JSON - CSV - Excel</text>
    </g>
    <text x="20" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="700" font-size="13" fill="#5b1fa0">PPE bills each pushed row</text>
  </g>

  <g transform="translate(60, 640)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-weight="700" font-size="14" fill="#ffffff">Same actor for buy, rent, sold prices, and estate agents.</text>
    <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="13" fill="#c8d3e6">Location query or URL - UPRN history - optional emails - instant agent database.</text>
  </g>
  <text x="1140" y="700" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="12" fill="#c8d3e6" opacity="0.6" letter-spacing="2">APIFY ACTOR - v0.1</text>
</svg>
