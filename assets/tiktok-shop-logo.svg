<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B6CFF"/>
      <stop offset="55%" stop-color="#5B3DF5"/>
      <stop offset="100%" stop-color="#3A22B5"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded card -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- decorative dashed circles (house motif) -->
  <g opacity="0.12">
    <circle cx="436" cy="84" r="112" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="5 9"/>
    <circle cx="68" cy="448" r="124" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="5 9"/>
  </g>

  <!-- Shopping bag with a play triangle: TikTok Shop -->
  <g filter="url(#dropShadow)">
    <!-- handle -->
    <path d="M176 196 V160 a80 80 0 0 1 160 0 v36" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
    <!-- bag body -->
    <path d="M120 196 H392 a18 18 0 0 1 18 18 L390 420 a30 30 0 0 1 -30 28 H152 a30 30 0 0 1 -30 -28 L102 214 a18 18 0 0 1 18 -18 z" fill="#FFFFFF"/>
    <!-- play triangle cut into the bag -->
    <path d="M222 268 L322 326 L222 384 z" fill="url(#bgGrad)"/>
  </g>
</svg>
