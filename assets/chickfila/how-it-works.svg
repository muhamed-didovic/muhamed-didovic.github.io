<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdf2f1"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#E51636" flood-opacity="0.13"/></filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#B10E28" flood-opacity="0.28"/></filter>
    <style><![CDATA[
      .title{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;}
      .subtitle{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;}
      .card-title{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;}
      .label{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500;}
      .small{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;}
      .badge-num{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;}
      .mono{font-family:"SF Mono","Menlo","Monaco","Consolas",monospace;font-weight:400;}
    ]]></style>
  </defs>
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <text x="800" y="92" text-anchor="middle" class="title" font-size="44" fill="#B10E28">How the Chick-fil-A Menu Scraper Works</text>
  <text x="800" y="138" text-anchor="middle" class="subtitle" font-size="22" fill="#9A5A57">From a street address to that restaurant's real prices</text>
  <line x1="620" y1="170" x2="980" y2="170" stroke="#E6C8C6" stroke-width="2"/>
  <g stroke="#004F71" stroke-width="3" stroke-linecap="round">
    <line x1="516" y1="470" x2="556" y2="470"/><path d="M556 470l-13-8v16z" fill="#004F71" stroke="none"/>
    <line x1="1044" y1="470" x2="1084" y2="470"/><path d="M1084 470l-13-8v16z" fill="#004F71" stroke="none"/>
  </g>
  <g filter="url(#cardShadow)"><rect x="80" y="230" width="436" height="480" rx="20" fill="#ffffff"/></g>
  <g filter="url(#badgeShadow)"><circle cx="118" cy="268" r="26" fill="#E51636"/></g>
  <text x="118" y="278" text-anchor="middle" class="badge-num" font-size="26" fill="#ffffff">1</text>
  <text x="162" y="278" class="card-title" font-size="27" fill="#B10E28">You give a location</text>
  <text x="112" y="330" class="label" font-size="18" fill="#9A5A57">Any of these, mixed freely, as many as you like</text>
  <rect x="112" y="350" width="372" height="52" rx="10" fill="#FBECEA" stroke="#EBD1CF"/><text x="130" y="382" class="mono" font-size="15" fill="#B10E28">4620 U.S. 280, Birmingham, AL</text>
  <rect x="112" y="414" width="372" height="52" rx="10" fill="#FBECEA" stroke="#EBD1CF"/><text x="130" y="446" class="mono" font-size="15" fill="#B10E28">Manhattan, New York, NY</text>
  <rect x="112" y="478" width="176" height="52" rx="10" fill="#FBECEA" stroke="#EBD1CF"/><text x="130" y="510" class="mono" font-size="15" fill="#B10E28">35242</text>
  <rect x="308" y="478" width="176" height="52" rx="10" fill="#F1E6E5" stroke="#E0CFCD"/><text x="326" y="510" class="mono" font-size="15" fill="#7A5856">loc #00812</text>
  <text x="112" y="600" class="small" font-size="17" fill="#9A5A57">Addresses, ZIPs, cities and location</text>
  <text x="112" y="628" class="small" font-size="17" fill="#9A5A57">numbers all work in one run.</text>
  <g filter="url(#cardShadow)"><rect x="556" y="230" width="488" height="480" rx="20" fill="#ffffff"/></g>
  <g filter="url(#badgeShadow)"><circle cx="594" cy="268" r="26" fill="#E51636"/></g>
  <text x="594" y="278" text-anchor="middle" class="badge-num" font-size="26" fill="#ffffff">2</text>
  <text x="638" y="278" class="card-title" font-size="27" fill="#B10E28">The restaurant is matched</text>
  <rect x="588" y="322" width="424" height="70" rx="12" fill="#FBECEA" stroke="#EBD1CF"/>
  <text x="608" y="350" class="label" font-size="17" fill="#9A5A57">Location search + guest session</text>
  <text x="608" y="376" class="mono" font-size="14" fill="#B10E28">address → location numbers, US-only token</text>
  <line x1="800" y1="398" x2="800" y2="420" stroke="#D9BEBC" stroke-width="2"/><path d="M800 420l-7-11h14z" fill="#D9BEBC"/>
  <rect x="588" y="426" width="424" height="70" rx="12" fill="#FBECEA" stroke="#EBD1CF"/>
  <text x="608" y="454" class="label" font-size="17" fill="#9A5A57">Restaurant detail + menu URL</text>
  <text x="608" y="480" class="mono" font-size="14" fill="#B10E28">address · hours · phone · operator · GPS</text>
  <line x1="800" y1="502" x2="800" y2="524" stroke="#D9BEBC" stroke-width="2"/><path d="M800 524l-7-11h14z" fill="#D9BEBC"/>
  <rect x="588" y="530" width="424" height="128" rx="12" fill="#E51636"/>
  <text x="608" y="564" class="label" font-size="16" fill="#F6C9A8">MATCHED</text>
  <text x="608" y="596" class="card-title" font-size="22" fill="#ffffff">#00812 · 4620 US 280 South</text>
  <text x="608" y="624" class="small" font-size="17" fill="#F3CFCB">Birmingham, Alabama · Inverness</text>
  <text x="608" y="648" class="small" font-size="15" fill="#EDBDB8">operated by Mark Meadows</text>
  <g filter="url(#cardShadow)"><rect x="1084" y="230" width="436" height="480" rx="20" fill="#ffffff"/></g>
  <g filter="url(#badgeShadow)"><circle cx="1122" cy="268" r="26" fill="#E51636"/></g>
  <text x="1122" y="278" text-anchor="middle" class="badge-num" font-size="26" fill="#ffffff">3</text>
  <text x="1166" y="278" class="card-title" font-size="27" fill="#B10E28">The menu comes back</text>
  <text x="1116" y="326" class="label" font-size="18" fill="#9A5A57">~70 priced products, one row each</text>
  <rect x="1116" y="344" width="372" height="76" rx="12" fill="#FBECEA" stroke="#EBD1CF"/>
  <text x="1136" y="374" class="card-title" font-size="20" fill="#B10E28">Chicken Biscuit Meal</text>
  <text x="1136" y="402" class="mono" font-size="20" fill="#E51636">$6.89</text><text x="1216" y="402" class="small" font-size="15" fill="#9A5A57">Breakfast</text>
  <rect x="1116" y="432" width="372" height="76" rx="12" fill="#FBECEA" stroke="#EBD1CF"/>
  <text x="1136" y="462" class="card-title" font-size="20" fill="#B10E28">Egg White Grill Meal</text>
  <text x="1136" y="490" class="mono" font-size="20" fill="#E51636">$8.35</text><text x="1216" y="490" class="small" font-size="15" fill="#9A5A57">Breakfast</text>
  <rect x="1116" y="520" width="372" height="76" rx="12" fill="#FBECEA" stroke="#EBD1CF"/>
  <text x="1136" y="550" class="card-title" font-size="20" fill="#B10E28">Chick-fil-A® Sandwich Meal</text>
  <text x="1136" y="578" class="mono" font-size="20" fill="#E51636">$9.09</text><text x="1216" y="578" class="small" font-size="15" fill="#9A5A57">Meals</text>
  <text x="1116" y="640" class="small" font-size="17" fill="#9A5A57">Every category: Entrées, Sides,</text>
  <text x="1116" y="666" class="small" font-size="17" fill="#9A5A57">Treats, Beverages and more.</text>
  <rect x="80" y="754" width="1440" height="76" rx="16" fill="#B10E28"/>
  <g class="label" font-size="19" fill="#FBEFEA">
    <circle cx="146" cy="792" r="5" fill="#F6C9A8"/><text x="166" y="799">Pure HTTP, no browser</text>
    <circle cx="470" cy="792" r="5" fill="#F6C9A8"/><text x="490" y="799">US residential proxy required</text>
    <circle cx="864" cy="792" r="5" fill="#F6C9A8"/><text x="884" y="799">No login</text>
    <circle cx="1086" cy="792" r="5" fill="#F6C9A8"/><text x="1106" y="799">Prices are per restaurant</text>
  </g>
</svg>
