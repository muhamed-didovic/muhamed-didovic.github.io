<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8f1f18"/>
      <stop offset="52%" stop-color="#f71414"/>
      <stop offset="100%" stop-color="#5e1b16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#3d0f0c" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- price bands in the backdrop: the partitions the crawl is split into -->
  <g fill="#ffffff" opacity="0.07">
    <rect x="60"   y="470" width="46" height="160" rx="8"/>
    <rect x="120"  y="410" width="46" height="220" rx="8"/>
    <rect x="180"  y="356" width="46" height="274" rx="8"/>
    <rect x="240"  y="392" width="46" height="238" rx="8"/>
    <rect x="960"  y="430" width="46" height="200" rx="8"/>
    <rect x="1020" y="372" width="46" height="258" rx="8"/>
    <rect x="1080" y="446" width="46" height="184" rx="8"/>
  </g>

  <!-- LEFT column -->
  <g>
    <rect x="72" y="60" width="300" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
    <text x="96" y="89" font-family="Helvetica, Arial, sans-serif" font-size="22"
          font-weight="700" fill="#ffffff" letter-spacing="1.5">BLOCKET.SE · SWEDEN</text>

    <text x="72" y="182" font-family="Helvetica, Arial, sans-serif" font-size="66"
          font-weight="800" fill="#ffffff">Blocket Scraper</text>

    <text x="72" y="238" font-family="Helvetica, Arial, sans-serif" font-size="28"
          font-weight="600" fill="#ffffff" opacity="0.93">Every car, not just the first 2,450</text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#ffffff" opacity="0.92">
      <text x="72" y="300">Price · mileage · VIN · reg number · images</text>
      <text x="72" y="340">Battery kWh · range · equipment · inspection</text>
      <text x="72" y="380">Phone, email, website and address per seller</text>
    </g>

    <g>
      <rect x="72" y="418" width="232" height="52" rx="26" fill="#ffffff" opacity="0.17"/>
      <text x="96" y="452" font-family="Helvetica, Arial, sans-serif" font-size="22"
            font-weight="700" fill="#ffffff">~144,000 cars</text>
      <rect x="320" y="418" width="210" height="52" rx="26" fill="#ffffff" opacity="0.17"/>
      <text x="344" y="452" font-family="Helvetica, Arial, sans-serif" font-size="22"
            font-weight="700" fill="#ffffff">79 fields</text>
    </g>

    <text x="72" y="536" font-family="Helvetica, Arial, sans-serif" font-size="21"
          fill="#ffffff" opacity="0.78">Pure HTTP · no browser · JSON or CSV</text>
  </g>

  <!-- RIGHT: a sample row -->
  <g filter="url(#softShadow)">
    <rect x="640" y="112" width="490" height="406" rx="26" fill="url(#cardGrad)"/>

    <rect x="640" y="112" width="490" height="76" rx="26" fill="#f71414"/>
    <rect x="640" y="162" width="490" height="26" fill="#f71414"/>
    <text x="672" y="160" font-family="Helvetica, Arial, sans-serif" font-size="27"
          font-weight="700" fill="#ffffff">Tesla Model X · 2017</text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="21">
      <text x="672" y="238" fill="#7a6a6a">Price</text>
      <text x="1098" y="238" text-anchor="end" font-weight="700" fill="#231a1a">308 900 kr</text>
      <text x="672" y="284" fill="#7a6a6a">Mileage</text>
      <text x="1098" y="284" text-anchor="end" font-weight="700" fill="#231a1a">147 290 km</text>
      <text x="672" y="330" fill="#7a6a6a">Battery</text>
      <text x="1098" y="330" text-anchor="end" font-weight="700" fill="#231a1a">100 kWh</text>
      <text x="672" y="376" fill="#7a6a6a">VIN</text>
      <text x="1098" y="376" text-anchor="end" font-weight="700" fill="#231a1a">5YJXCCE29HF045288</text>
      <text x="672" y="422" fill="#7a6a6a">Reg. no</text>
      <text x="1098" y="422" text-anchor="end" font-weight="700" fill="#231a1a">YGT452</text>
      <text x="672" y="468" fill="#7a6a6a">Seller phone</text>
      <text x="1098" y="468" text-anchor="end" font-weight="700" fill="#231a1a">073-518 06 90</text>
    </g>

    <rect x="672" y="492" width="426" height="2" fill="#f0dede"/>
  </g>
</svg>
