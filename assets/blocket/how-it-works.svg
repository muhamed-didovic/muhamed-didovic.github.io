<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffafa"/>
      <stop offset="100%" stop-color="#f6eaea"/>
    </linearGradient>
    <filter id="hs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7a2822" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f71414"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#hbg)"/>

  <text x="600" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#2b1210">How the Blocket scraper reaches every car</text>
  <text x="600" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="20" fill="#7a2822">Blocket answers any single query with at most 2,450 ads — so the query gets split until it fits</text>

  <!-- STEP 1 -->
  <g filter="url(#hs)">
    <rect x="48" y="150" width="250" height="196" rx="18" fill="#ffffff"/>
    <rect x="48" y="150" width="250" height="52" rx="18" fill="#f71414"/>
    <rect x="48" y="182" width="250" height="20" fill="#f71414"/>
    <text x="173" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#ffffff">1 · You give</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3b2a2a">
      <text x="72" y="240">A search URL, with any</text>
      <text x="72" y="264">Blocket filter you like</text>
      <text x="72" y="296" fill="#7a6a6a">— or single ad URLs</text>
      <text x="72" y="320" fill="#7a6a6a">— or a dealer's org ID</text>
    </g>
  </g>

  <!-- STEP 2 — the partitioner -->
  <g filter="url(#hs)">
    <rect x="338" y="150" width="290" height="380" rx="18" fill="#ffffff"/>
    <rect x="338" y="150" width="290" height="52" rx="18" fill="#7a2822"/>
    <rect x="338" y="182" width="290" height="20" fill="#7a2822"/>
    <text x="483" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#ffffff">2 · Split under the wall</text>

    <text x="362" y="238" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3b2a2a">
      144,096 ads asked for</text>

    <!-- the wall -->
    <rect x="362" y="256" width="242" height="34" rx="8" fill="#f7dede"/>
    <rect x="362" y="256" width="42" height="34" rx="8" fill="#f71414"/>
    <text x="383" y="279" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="14" font-weight="700" fill="#ffffff">2450</text>
    <text x="520" y="279" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="14" fill="#8a5c5c">the rest is unreachable</text>

    <text x="362" y="330" font-family="Helvetica, Arial, sans-serif" font-size="17"
          font-weight="700" fill="#7a2822">So the price range is halved,</text>
    <text x="362" y="354" font-family="Helvetica, Arial, sans-serif" font-size="17"
          font-weight="700" fill="#7a2822">again, until every piece fits</text>

    <!-- bisection tree -->
    <g stroke="#f71414" stroke-width="2" fill="none">
      <path d="M483 372 L413 402"/><path d="M483 372 L553 402"/>
      <path d="M413 424 L378 452"/><path d="M413 424 L448 452"/>
      <path d="M553 424 L518 452"/><path d="M553 424 L588 452"/>
    </g>
    <g fill="#f71414">
      <rect x="463" y="362" width="40" height="12" rx="6"/>
      <rect x="393" y="412" width="40" height="12" rx="6"/>
      <rect x="533" y="412" width="40" height="12" rx="6"/>
    </g>
    <g fill="#2fa36b">
      <rect x="358" y="452" width="40" height="12" rx="6"/>
      <rect x="428" y="452" width="40" height="12" rx="6"/>
      <rect x="498" y="452" width="40" height="12" rx="6"/>
      <rect x="568" y="452" width="40" height="12" rx="6"/>
    </g>
    <text x="483" y="496" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="16" fill="#3b2a2a">127 partitions, all under the wall</text>
  </g>

  <!-- STEP 3 -->
  <g filter="url(#hs)">
    <rect x="668" y="150" width="250" height="380" rx="18" fill="#ffffff"/>
    <rect x="668" y="150" width="250" height="52" rx="18" fill="#f71414"/>
    <rect x="668" y="182" width="250" height="20" fill="#f71414"/>
    <text x="793" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#ffffff">3 · Read</text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#3b2a2a">
      <text x="692" y="236" font-weight="700" fill="#7a2822">Search pages</text>
      <text x="692" y="260">~35 fields per car already</text>

      <text x="692" y="304" font-weight="700" fill="#7a2822">Each ad</text>
      <text x="692" y="328">description, equipment,</text>
      <text x="692" y="350">battery kWh, colour,</text>
      <text x="692" y="372">inspection, address</text>

      <text x="692" y="416" font-weight="700" fill="#7a2822">Each dealer, once</text>
      <text x="692" y="440">website, email, postcode</text>

      <text x="692" y="484" font-weight="700" fill="#7a2822">Phone on request</text>
      <text x="692" y="506">the number behind the button</text>
    </g>
  </g>

  <!-- STEP 4 -->
  <g filter="url(#hs)">
    <rect x="958" y="150" width="200" height="380" rx="18" fill="#ffffff"/>
    <rect x="958" y="150" width="200" height="52" rx="18" fill="#2fa36b"/>
    <rect x="958" y="182" width="200" height="20" fill="#2fa36b"/>
    <text x="1058" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#ffffff">4 · You get</text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#3b2a2a">
      <text x="982" y="238">One row per car</text>
      <text x="982" y="266">79 stable columns</text>
      <text x="982" y="294">Deduplicated by ad ID</text>
      <text x="982" y="322">JSON, CSV, Excel</text>
    </g>

    <rect x="982" y="352" width="152" height="150" rx="12" fill="#eef8f2"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d6b45">
      <text x="998" y="380" font-weight="700">Coverage check</text>
      <text x="998" y="406">reported  144,096</text>
      <text x="998" y="428">collected 144,071</text>
      <text x="998" y="450">delta     logged</text>
      <text x="998" y="480" fill="#3b2a2a">never truncated</text>
      <text x="998" y="496" fill="#3b2a2a">in silence</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#f71414" stroke-width="3" marker-end="url(#arrow)">
    <path d="M304 248 L332 248" fill="none"/>
    <path d="M634 340 L662 340" fill="none"/>
    <path d="M924 340 L952 340" fill="none"/>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="19" fill="#7a2822">Pure HTTP throughout — the data ships inside Blocket's own server-rendered pages, so no browser runs</text>
  <text x="600" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="17" fill="#8a5c5c">Bounds are measured per run, never hardcoded, so the split keeps working as the market moves</text>
</svg>
