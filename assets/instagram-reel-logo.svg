<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Instagram-inspired diagonal gradient (original motif, not the IG glyph) -->
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F9CE34"/>
      <stop offset="28%" stop-color="#EE2A7B"/>
      <stop offset="62%" stop-color="#C13584"/>
      <stop offset="100%" stop-color="#6228D7"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#2a0a3a" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ig)"/>
  <circle cx="150" cy="140" r="230" fill="#ffffff" opacity="0.10"/>

  <!-- A reel is a single tall frame, not a carousel stack -->
  <g filter="url(#ds)">
    <rect x="146" y="96" width="220" height="320" rx="34" fill="#ffffff"/>
  </g>

  <!-- Sprocket holes down both edges: film, i.e. video rather than photo -->
  <g fill="#EE2A7B" opacity="0.22">
    <rect x="164" y="126" width="20" height="26" rx="6"/>
    <rect x="164" y="172" width="20" height="26" rx="6"/>
    <rect x="164" y="314" width="20" height="26" rx="6"/>
    <rect x="164" y="360" width="20" height="26" rx="6"/>
    <rect x="328" y="126" width="20" height="26" rx="6"/>
    <rect x="328" y="172" width="20" height="26" rx="6"/>
    <rect x="328" y="314" width="20" height="26" rx="6"/>
    <rect x="328" y="360" width="20" height="26" rx="6"/>
  </g>

  <!-- Play badge, centred on the frame -->
  <g transform="translate(256,232)">
    <circle r="56" fill="#C13584"/>
    <polygon points="-18,-28 -18,28 28,0" fill="#ffffff"/>
  </g>

  <!-- Play-count bar: the structured number this actor exists to return -->
  <g transform="translate(196,332)">
    <rect width="120" height="14" rx="7" fill="#6228D7" opacity="0.20"/>
    <rect width="92"  height="14" rx="7" fill="#6228D7" opacity="0.72"/>
  </g>
  <g transform="translate(196,362)">
    <rect width="120" height="14" rx="7" fill="#6228D7" opacity="0.14"/>
    <rect width="58"  height="14" rx="7" fill="#6228D7" opacity="0.48"/>
  </g>
</svg>
