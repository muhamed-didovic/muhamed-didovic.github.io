<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff5f6"/><stop offset="100%" stop-color="#ffe3e7"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d1102e"/><stop offset="100%" stop-color="#8e0b20"/></linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#8e0b20" flood-opacity="0.20"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="44" fill="#1c1c1c">How the BAUHAUS Product Scraper works</text>
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="23" fill="#6b2a32">Keywords or a category URL in · one row per product out</text>
  <g transform="translate(70,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#brand)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">1</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#1c1c1c">Input</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6b2a32">
      <text x="30" y="204">• Keywords</text>
      <text x="30" y="244">• Category URL</text>
      <text x="30" y="284">• overview / detail</text>
      <text x="30" y="324">• Sort order</text>
    </g>
  </g>
  <g transform="translate(450,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#brand)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">2</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#1c1c1c">Collect</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6b2a32">
      <text x="30" y="204">• Every result page</text>
      <text x="30" y="244">• Product detail</text>
      <text x="30" y="284">• Specs, SKU &amp; EAN</text>
      <text x="30" y="324">• Ratings &amp; reviews</text>
    </g>
  </g>
  <g transform="translate(830,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#brand)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">3</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#1c1c1c">Emit</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#6b2a32">
      <text x="30" y="204">• 1 row / product</text>
      <text x="30" y="244">• price as a number</text>
      <text x="30" y="284">• currency EUR</text>
      <text x="30" y="324">• JSON · CSV · Excel</text>
    </g>
  </g>
  <path d="M386 390 l44 0 m-12 -11 l12 11 l-12 11" stroke="#8e0b20" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M766 390 l44 0 m-12 -11 l12 11 l-12 11" stroke="#8e0b20" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <text x="600" y="662" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="19" fill="#6b2a32">One flat row per record · ready for your sheet, database or agent</text>
</svg>
