<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LinkedIn Profile Scraper logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#004182"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- central profile node -->
  <circle cx="256" cy="196" r="52" fill="#FFFFFF"/>
  <path d="M170 322c0-47 39-80 86-80s86 33 86 80v16H170z" fill="#FFFFFF"/>

  <!-- network edges to three connections -->
  <g stroke="#8FC7FF" stroke-width="11" stroke-linecap="round" opacity="0.92">
    <line x1="256" y1="360" x2="120" y2="404"/>
    <line x1="256" y1="360" x2="256" y2="420"/>
    <line x1="256" y1="360" x2="392" y2="404"/>
  </g>

  <!-- connection nodes -->
  <g fill="#8FC7FF">
    <circle cx="112" cy="414" r="30"/>
    <circle cx="256" cy="432" r="30"/>
    <circle cx="400" cy="414" r="30"/>
  </g>
</svg>
