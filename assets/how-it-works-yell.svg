<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#F7F3E4"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1A1608">How it works</text>
  <rect x="60" y="140" width="240" height="160" rx="16" fill="#1A1608"/>
  <text x="180" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF">Keyword + city</text>
  <text x="180" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFD100">restaurants / London</text>
  <rect x="340" y="140" width="240" height="160" rx="16" fill="#1A1608"/>
  <text x="460" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF">Search pages</text>
  <text x="460" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFD100">/s/...?pageNum=N</text>
  <rect x="620" y="140" width="240" height="160" rx="16" fill="#1A1608"/>
  <text x="740" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF">Search cards</text>
  <text x="740" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFD100">phone + address</text>
  <rect x="900" y="140" width="240" height="160" rx="16" fill="#FFD100"/>
  <text x="1020" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1A1608">One row</text>
  <text x="1020" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1A1608">+ hours on profile</text>
  <text x="600" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#333333">De-duplicate by /biz/ slug. Charge listing, then phone / email only when present.</text>
  <text x="600" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A1608">yell.com - HTTP first - Chrome if Cloudflare</text>
</svg>
