<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15151D"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Two requests out, one response back: the batch relay in one glance.
       Kept to three heavy bars so it still reads at 48px on a Store card. -->
  <g>
    <!-- request 1 -->
    <rect x="110" y="136" width="200" height="28" rx="14" fill="#38BDF8"/>
    <path d="M304 120 L396 150 L304 180 Z" fill="#38BDF8"/>

    <!-- request 2, dimmer — implies "and more" without adding clutter.
         Opacity sits on the GROUP, not the two shapes: per-shape opacity composites
         the bar and the arrowhead separately, so their overlap darkens into a visible
         seam. Group opacity flattens them first, then fades the result. -->
    <g fill="#38BDF8" opacity="0.55">
      <rect x="110" y="242" width="160" height="28" rx="14"/>
      <path d="M264 226 L356 256 L264 286 Z"/>
    </g>

    <!-- response back, green for 2xx -->
    <rect x="202" y="348" width="200" height="28" rx="14" fill="#4ADE80"/>
    <path d="M208 332 L116 362 L208 392 Z" fill="#4ADE80"/>
  </g>
</svg>
