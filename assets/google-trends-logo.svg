<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#174ea6"/>
    </linearGradient>
    <filter id="lineShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b3d91" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#tileGrad)"/>

  <!-- baseline grid -->
  <g stroke="#8ab4f8" stroke-opacity="0.30" stroke-width="3">
    <line x1="96" y1="152" x2="416" y2="152"/>
    <line x1="96" y1="232" x2="416" y2="232"/>
    <line x1="96" y1="312" x2="416" y2="312"/>
  </g>
  <line x1="96" y1="392" x2="416" y2="392" stroke="#8ab4f8" stroke-opacity="0.65" stroke-width="4"/>

  <!-- rising trend line -->
  <polyline points="112,352 176,300 240,326 304,214 368,140"
            fill="none" stroke="#ffffff" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#lineShadow)"/>

  <!-- data points -->
  <g fill="#ffffff">
    <circle cx="176" cy="300" r="15"/>
    <circle cx="240" cy="326" r="15"/>
    <circle cx="304" cy="214" r="15"/>
  </g>

  <!-- breakout peak -->
  <circle cx="368" cy="140" r="34" fill="#fdd663"/>
  <circle cx="368" cy="140" r="16" fill="#174ea6"/>
</svg>
