<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FB"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0E4D7B" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="96" fill="#0E4D7B"/>
  <text x="40" y="46" fill="#FFFFFF" font-size="28" font-weight="700">Argenprop Scraper</text>
  <text x="40" y="74" fill="#D6E9F8" font-size="16" font-weight="500">Argentina and Uruguay property listings from any search URL</text>
  <text x="1160" y="56" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="end">JSON, CSV, Excel</text>
  <path d="M390 360 l24 0 l0 -12 l22 20 l-22 20 l0 -12 l-24 0 z" fill="#0E4D7B"/>
  <path d="M786 360 l24 0 l0 -12 l22 20 l-22 20 l0 -12 l-24 0 z" fill="#0E4D7B"/>
  <g filter="url(#sh)">
    <rect x="36" y="132" width="340" height="520" rx="16" fill="#FFFFFF" stroke="#D3E4F4" stroke-width="1.5"/>
  </g>
  <rect x="36" y="132" width="340" height="64" rx="16" fill="#0E4D7B"/>
  <rect x="36" y="172" width="340" height="24" fill="#0E4D7B"/>
  <circle cx="72" cy="164" r="16" fill="#FFFFFF"/>
  <text x="72" y="170" fill="#0E4D7B" font-size="16" font-weight="800" text-anchor="middle">1</text>
  <text x="100" y="170" fill="#FFFFFF" font-size="18" font-weight="700">Paste a search URL</text>
  <g font-size="16" fill="#2F2F2F">
    <circle cx="68" cy="250" r="5" fill="#0E4D7B"/><text x="84" y="256" font-weight="700">Sale</text><text x="160" y="256" fill="#6A6A6A">/venta/</text>
    <circle cx="68" cy="310" r="5" fill="#0E4D7B"/><text x="84" y="316" font-weight="700">Rent</text><text x="160" y="316" fill="#6A6A6A">/alquiler/</text>
    <circle cx="68" cy="370" r="5" fill="#0E4D7B"/><text x="84" y="376" font-weight="700">Temporary</text><text x="190" y="376" fill="#6A6A6A">alquiler temporal</text>
    <circle cx="68" cy="430" r="5" fill="#0E4D7B"/><text x="84" y="436" font-weight="700">One listing</text><text x="190" y="436" fill="#6A6A6A">URL ending in --id</text>
  </g>
  <text x="60" y="540" font-size="14" fill="#6A6A6A">Filter on argenprop.com, then copy</text>
  <text x="60" y="562" font-size="14" fill="#6A6A6A">the address bar. Pages are walked</text>
  <text x="60" y="584" font-size="14" fill="#6A6A6A">until maxItems.</text>
  <g filter="url(#sh)">
    <rect x="430" y="132" width="340" height="520" rx="16" fill="#FFFFFF" stroke="#D3E4F4" stroke-width="1.5"/>
  </g>
  <rect x="430" y="132" width="340" height="64" rx="16" fill="#0E4D7B"/>
  <rect x="430" y="172" width="340" height="24" fill="#0E4D7B"/>
  <circle cx="466" cy="164" r="16" fill="#FFFFFF"/>
  <text x="466" y="170" fill="#0E4D7B" font-size="16" font-weight="800" text-anchor="middle">2</text>
  <text x="494" y="170" fill="#FFFFFF" font-size="18" font-weight="700">Read each listing</text>
  <g font-size="16" fill="#2F2F2F">
    <circle cx="462" cy="260" r="5" fill="#0E4D7B"/><text x="478" y="266">Collect listing ids from</text>
    <text x="478" y="290">the results page</text>
    <circle cx="462" cy="350" r="5" fill="#0E4D7B"/><text x="478" y="356">Open the public listing</text>
    <text x="478" y="380">record for each id</text>
    <circle cx="462" cy="440" r="5" fill="#0E4D7B"/><text x="478" y="446">Page through the search</text>
    <text x="478" y="470">until your cap</text>
    <circle cx="462" cy="530" r="5" fill="#E8A317"/><text x="478" y="536" font-weight="700">Map fields to English</text>
  </g>
  <text x="454" y="600" font-size="14" fill="#6A6A6A">No browser. No login.</text>
  <g filter="url(#sh)">
    <rect x="824" y="132" width="340" height="520" rx="16" fill="#FFFFFF" stroke="#D3E4F4" stroke-width="1.5"/>
  </g>
  <rect x="824" y="132" width="340" height="64" rx="16" fill="#0E4D7B"/>
  <rect x="824" y="172" width="340" height="24" fill="#0E4D7B"/>
  <circle cx="860" cy="164" r="16" fill="#FFFFFF"/>
  <text x="860" y="170" fill="#0E4D7B" font-size="16" font-weight="800" text-anchor="middle">3</text>
  <text x="888" y="170" fill="#FFFFFF" font-size="18" font-weight="700">Structured rows</text>
  <g font-size="16" fill="#2F2F2F">
    <path d="M856 246 l6 6 l12 -14" stroke="#2E7D32" stroke-width="3" fill="none" stroke-linecap="round"/><text x="884" y="252">Price, expenses, currency</text>
    <path d="M856 292 l6 6 l12 -14" stroke="#2E7D32" stroke-width="3" fill="none" stroke-linecap="round"/><text x="884" y="298">Rooms, m2, antiquity</text>
    <path d="M856 338 l6 6 l12 -14" stroke="#2E7D32" stroke-width="3" fill="none" stroke-linecap="round"/><text x="884" y="344">Address and geo</text>
    <path d="M856 384 l6 6 l12 -14" stroke="#2E7D32" stroke-width="3" fill="none" stroke-linecap="round"/><text x="884" y="390">Photos</text>
    <path d="M856 430 l6 6 l12 -14" stroke="#E8A317" stroke-width="3" fill="none" stroke-linecap="round"/><text x="884" y="436" font-weight="700">Phone</text>
    <path d="M856 476 l6 6 l12 -14" stroke="#E8A317" stroke-width="3" fill="none" stroke-linecap="round"/><text x="884" y="482" font-weight="700">WhatsApp</text>
  </g>
  <text x="848" y="560" font-size="14" fill="#6A6A6A">33 fields. Billed per listing.</text>
</svg>
