<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d5fd6"/>
      <stop offset="60%" stop-color="#0b46b0"/>
      <stop offset="100%" stop-color="#062f7a"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe14d"/>
      <stop offset="100%" stop-color="#ffc300"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe9fb"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="dsLite" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded card -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- decorative dashed circles -->
  <g opacity="0.12">
    <circle cx="440" cy="80" r="120" fill="none" stroke="#9cc0ff" stroke-width="3" stroke-dasharray="5 9"/>
    <circle cx="60" cy="450" r="125" fill="none" stroke="#9cc0ff" stroke-width="3" stroke-dasharray="5 9"/>
  </g>

  <!-- Price tag, tilted, point to the upper left -->
  <g filter="url(#ds)" transform="translate(236,268) rotate(-28)">
    <path d="M -150 0 L -86 -96 L 150 -96 Q 166 -96 166 -80 L 166 80 Q 166 96 150 96 L -86 96 Z"
          fill="url(#tagGrad)" stroke="#e0a800" stroke-width="3" stroke-linejoin="round"/>
    <!-- eyelet + string -->
    <circle cx="-92" cy="0" r="17" fill="#0b46b0"/>
    <circle cx="-92" cy="0" r="17" fill="none" stroke="#e0a800" stroke-width="3"/>
    <!-- price-drop chart, counter-rotated so it falls left to right on screen -->
    <g transform="translate(36,-14) rotate(28)" fill="none" stroke="#0b2a66" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-78,-38 -30,4 0,-18 62,40" stroke-width="16"/>
      <polyline points="26,44 66,44 66,4" stroke-width="16"/>
    </g>
  </g>

  <!-- Search badge -->
  <g filter="url(#dsLite)" transform="translate(370,382)">
    <circle cx="0" cy="0" r="74" fill="#ffffff"/>
    <circle cx="-10" cy="-10" r="32" fill="url(#lensGrad)" stroke="#0b46b0" stroke-width="13"/>
    <line x1="14" y1="14" x2="42" y2="42" stroke="#0b46b0" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
