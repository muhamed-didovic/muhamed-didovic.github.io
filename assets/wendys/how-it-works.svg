<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf3f1"/><stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#B0161F" flood-opacity="0.13"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7E0F17" flood-opacity="0.28"/>
    </filter>
    <style><![CDATA[
      .title{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;}
      .subtitle{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;}
      .card-title{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;}
      .label{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500;}
      .small{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;}
      .badge-num{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;}
      .mono{font-family:"SF Mono","Menlo","Monaco","Consolas",monospace;font-weight:400;}
    ]]></style>
  </defs>
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <text x="800" y="92" text-anchor="middle" class="title" font-size="44" fill="#7E0F17">How the Wendy's Menu Scraper Works</text>
  <text x="800" y="138" text-anchor="middle" class="subtitle" font-size="22" fill="#9A5A52">From a street address to that restaurant's real prices and calories</text>
  <line x1="620" y1="170" x2="980" y2="170" stroke="#E6C9C4" stroke-width="2"/>

  <g stroke="#0077A3" stroke-width="3" stroke-linecap="round">
    <line x1="516" y1="470" x2="556" y2="470"/><path d="M556 470l-13-8v16z" fill="#0077A3" stroke="none"/>
    <line x1="1044" y1="470" x2="1084" y2="470"/><path d="M1084 470l-13-8v16z" fill="#0077A3" stroke="none"/>
  </g>

  <!-- 1 -->
  <g filter="url(#cardShadow)"><rect x="80" y="230" width="436" height="480" rx="20" fill="#ffffff"/></g>
  <g filter="url(#badgeShadow)"><circle cx="118" cy="268" r="26" fill="#B0161F"/></g>
  <text x="118" y="278" text-anchor="middle" class="badge-num" font-size="26" fill="#ffffff">1</text>
  <text x="162" y="278" class="card-title" font-size="27" fill="#7E0F17">You give a location</text>
  <text x="112" y="330" class="label" font-size="18" fill="#9A5A52">Any of these, mixed freely, as many as you like</text>
  <g>
    <rect x="112" y="350" width="372" height="52" rx="10" fill="#FBEEEC" stroke="#EBD3CF"/><text x="130" y="382" class="mono" font-size="16" fill="#7E0F17">345 Valley Avenue, Birmingham, AL</text>
    <rect x="112" y="414" width="372" height="52" rx="10" fill="#FBEEEC" stroke="#EBD3CF"/><text x="130" y="446" class="mono" font-size="16" fill="#7E0F17">Times Square, New York, NY</text>
    <rect x="112" y="478" width="176" height="52" rx="10" fill="#FBEEEC" stroke="#EBD3CF"/><text x="130" y="510" class="mono" font-size="16" fill="#7E0F17">35209</text>
    <rect x="308" y="478" width="176" height="52" rx="10" fill="#F1E7E5" stroke="#E0D0CC"/><text x="326" y="510" class="mono" font-size="16" fill="#7A5850">store #1252</text>
  </g>
  <text x="112" y="600" class="small" font-size="17" fill="#9A5A52">Addresses, ZIPs, cities and store</text>
  <text x="112" y="628" class="small" font-size="17" fill="#9A5A52">numbers all work in one run.</text>

  <!-- 2 -->
  <g filter="url(#cardShadow)"><rect x="556" y="230" width="488" height="480" rx="20" fill="#ffffff"/></g>
  <g filter="url(#badgeShadow)"><circle cx="594" cy="268" r="26" fill="#B0161F"/></g>
  <text x="594" y="278" text-anchor="middle" class="badge-num" font-size="26" fill="#ffffff">2</text>
  <text x="638" y="278" class="card-title" font-size="27" fill="#7E0F17">The restaurant is matched</text>
  <g>
    <rect x="588" y="322" width="424" height="76" rx="12" fill="#FBEEEC" stroke="#EBD3CF"/>
    <text x="608" y="350" class="label" font-size="17" fill="#9A5A52">Wendy's location search</text>
    <text x="608" y="378" class="mono" font-size="15" fill="#7E0F17">nearbyLocations — geocodes the address</text>
    <line x1="800" y1="404" x2="800" y2="428" stroke="#D9BEB9" stroke-width="2"/><path d="M800 428l-7-11h14z" fill="#D9BEB9"/>
    <rect x="588" y="434" width="424" height="76" rx="12" fill="#FBEEEC" stroke="#EBD3CF"/>
    <text x="608" y="462" class="label" font-size="17" fill="#9A5A52">Nearest restaurant, with address</text>
    <text x="608" y="490" class="mono" font-size="15" fill="#7E0F17">hours · phone · drive-thru · coords</text>
    <line x1="800" y1="516" x2="800" y2="540" stroke="#D9BEB9" stroke-width="2"/><path d="M800 540l-7-11h14z" fill="#D9BEB9"/>
    <rect x="588" y="546" width="424" height="112" rx="12" fill="#B0161F"/>
    <text x="608" y="580" class="label" font-size="16" fill="#F3C7A0">MATCHED</text>
    <text x="608" y="612" class="card-title" font-size="22" fill="#ffffff">#1252 · 345 Valley Ave</text>
    <text x="608" y="640" class="small" font-size="17" fill="#F0D2CC">Birmingham, Alabama · open late</text>
  </g>

  <!-- 3 -->
  <g filter="url(#cardShadow)"><rect x="1084" y="230" width="436" height="480" rx="20" fill="#ffffff"/></g>
  <g filter="url(#badgeShadow)"><circle cx="1122" cy="268" r="26" fill="#B0161F"/></g>
  <text x="1122" y="278" text-anchor="middle" class="badge-num" font-size="26" fill="#ffffff">3</text>
  <text x="1166" y="278" class="card-title" font-size="27" fill="#7E0F17">The menu comes back</text>
  <text x="1116" y="326" class="label" font-size="18" fill="#9A5A52">~150 products, one row each</text>
  <g>
    <rect x="1116" y="344" width="372" height="92" rx="12" fill="#FBEEEC" stroke="#EBD3CF"/>
    <text x="1136" y="376" class="card-title" font-size="21" fill="#7E0F17">Baconator®</text>
    <text x="1136" y="404" class="mono" font-size="22" fill="#B0161F">$7.99</text>
    <text x="1206" y="404" class="small" font-size="15" fill="#9A5A52">890 Cal · Hamburgers</text>
    <text x="1136" y="424" class="small" font-size="14" fill="#7A5850">$9.99 at the Times Square store</text>

    <rect x="1116" y="448" width="372" height="76" rx="12" fill="#FBEEEC" stroke="#EBD3CF"/>
    <text x="1136" y="478" class="card-title" font-size="21" fill="#7E0F17">Dave's Combo</text>
    <text x="1136" y="506" class="mono" font-size="20" fill="#B0161F">$9.69</text>
    <text x="1206" y="506" class="small" font-size="15" fill="#9A5A52">combo · Combos</text>

    <rect x="1116" y="536" width="372" height="76" rx="12" fill="#FBEEEC" stroke="#EBD3CF"/>
    <text x="1136" y="566" class="card-title" font-size="21" fill="#7E0F17">Frosty®</text>
    <text x="1136" y="594" class="mono" font-size="20" fill="#B0161F">$2.99</text>
    <text x="1206" y="594" class="small" font-size="15" fill="#9A5A52">Frosty® · à la carte</text>
  </g>
  <text x="1116" y="656" class="small" font-size="17" fill="#9A5A52">Turn on details for descriptions</text>
  <text x="1116" y="682" class="small" font-size="17" fill="#9A5A52">and every customisation option.</text>

  <rect x="80" y="754" width="1440" height="76" rx="16" fill="#7E0F17"/>
  <g class="label" font-size="19" fill="#FBF3E9">
    <circle cx="146" cy="792" r="5" fill="#F3C7A0"/><text x="166" y="799">Pure HTTP, no browser</text>
    <circle cx="470" cy="792" r="5" fill="#F3C7A0"/><text x="490" y="799">No proxy required</text>
    <circle cx="764" cy="792" r="5" fill="#F3C7A0"/><text x="784" y="799">No API key, no login</text>
    <circle cx="1086" cy="792" r="5" fill="#F3C7A0"/><text x="1106" y="799">Prices are per restaurant</text>
  </g>
</svg>
