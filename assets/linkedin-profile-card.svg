<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="LinkedIn Profile Scraper store card">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F33"/>
      <stop offset="55%" stop-color="#0A3763"/>
      <stop offset="100%" stop-color="#0A66C2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#cbg)"/>

  <!-- subtle network motif, right side -->
  <g opacity="0.16">
    <g stroke="#8FC7FF" stroke-width="4" stroke-linecap="round">
      <line x1="980" y1="196" x2="880" y2="316"/>
      <line x1="980" y1="196" x2="1078" y2="316"/>
      <line x1="980" y1="196" x2="980" y2="330"/>
      <line x1="880" y1="316" x2="980" y2="430"/>
      <line x1="1078" y1="316" x2="980" y2="430"/>
    </g>
    <g fill="#8FC7FF">
      <circle cx="980" cy="188" r="34"/>
      <circle cx="874" cy="318" r="24"/>
      <circle cx="1084" cy="318" r="24"/>
      <circle cx="980" cy="438" r="24"/>
    </g>
  </g>

  <text x="84" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#FFFFFF">LinkedIn Profile Scraper</text>

  <text x="84" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#9FCBF5">Full profiles — or your entire first-degree network</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#E7F1FB">
    <text x="84" y="342">▸  Work history, education, skills, languages</text>
    <text x="84" y="392">▸  One toggle exports all your own connections</text>
    <text x="84" y="442">▸  No 1,000-result search cap</text>
  </g>

  <rect x="84" y="496" width="232" height="60" rx="30" fill="#0A66C2"/>
  <text x="200" y="535" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">$0.001 / profile</text>

  <text x="352" y="535" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#7FB3E3">JSON · CSV · Excel</text>
</svg>
