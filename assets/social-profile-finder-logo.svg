<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B6CFF"/>
      <stop offset="55%" stop-color="#5B3DF5"/>
      <stop offset="100%" stop-color="#3A22B5"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded card -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- decorative dashed circles (house motif) -->
  <g opacity="0.12">
    <circle cx="436" cy="84" r="112" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="5 9"/>
    <circle cx="68" cy="448" r="124" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="5 9"/>
  </g>

  <!-- Satellite networks: three nodes tethered to the central person -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.92">
    <line x1="256" y1="236" x2="118" y2="132"/>
    <line x1="256" y1="236" x2="394" y2="132"/>
    <line x1="256" y1="236" x2="256" y2="86"/>
  </g>
  <g fill="#FFFFFF" filter="url(#dropShadow)">
    <circle cx="118" cy="132" r="34"/>
    <circle cx="394" cy="132" r="34"/>
    <circle cx="256" cy="86"  r="34"/>
  </g>
  <!-- tiny person marks inside the satellites -->
  <g fill="#5B3DF5">
    <circle cx="118" cy="122" r="9"/><path d="M100 150 a18 14 0 0 1 36 0 z"/>
    <circle cx="394" cy="122" r="9"/><path d="M376 150 a18 14 0 0 1 36 0 z"/>
    <circle cx="256" cy="76"  r="9"/><path d="M238 104 a18 14 0 0 1 36 0 z"/>
  </g>

  <!-- Central person, inside a magnifier lens -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="286" r="118" fill="#FFFFFF"/>
    <circle cx="256" cy="286" r="94" fill="url(#bgGrad)"/>
    <!-- head + shoulders -->
    <circle cx="256" cy="258" r="30" fill="#FFFFFF"/>
    <path d="M196 342 a60 44 0 0 1 120 0 z" fill="#FFFFFF"/>
    <!-- magnifier handle -->
    <line x1="342" y1="372" x2="418" y2="448" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
