<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6ef"/>
      <stop offset="100%" stop-color="#ffe8d6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#e64a00"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#c23f00" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" fill="#1c1c1c">How the Funda.nl Scraper works</text>
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="24" fill="#5a4636">Pure HTTP · no browser · no CAPTCHA service</text>

  <!-- Column template -->
  <!-- 1. Input -->
  <g transform="translate(70,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#orange)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="38" fill="#ffffff">1</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="28" fill="#1c1c1c">Input</text>
    <g font-family="-apple-system,Arial,sans-serif" font-weight="600" font-size="19" fill="#5a4636">
      <text x="34" y="204">• Search URL</text>
      <text x="34" y="244">• Listing URL</text>
      <text x="34" y="284">• City + price</text>
      <text x="34" y="324">• buy / rent</text>
    </g>
  </g>

  <!-- 2. Fetch & parse -->
  <g transform="translate(450,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#orange)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="38" fill="#ffffff">2</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="28" fill="#1c1c1c">Fetch &amp; enrich</text>
    <g font-family="-apple-system,Arial,sans-serif" font-weight="600" font-size="19" fill="#5a4636">
      <text x="34" y="204">• Paginate search</text>
      <text x="34" y="244">• Full detail payload</text>
      <text x="34" y="284">• Neighborhood data</text>
      <text x="34" y="324">• Agent emails</text>
    </g>
  </g>

  <!-- 3. Emit -->
  <g transform="translate(830,200)">
    <rect width="300" height="380" rx="20" fill="#ffffff" filter="url(#ds)"/>
    <circle cx="150" cy="70" r="40" fill="url(#orange)"/>
    <text x="150" y="84" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="38" fill="#ffffff">3</text>
    <text x="150" y="150" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-weight="800" font-size="28" fill="#1c1c1c">Emit</text>
    <g font-family="-apple-system,Arial,sans-serif" font-weight="600" font-size="19" fill="#5a4636">
      <text x="34" y="204">• 1 flat row / home</text>
      <text x="34" y="244">• JSON · CSV · Excel</text>
      <text x="34" y="284">• Dedup by store</text>
      <text x="34" y="324">• $0.75 / 1,000</text>
    </g>
  </g>

  <!-- arrows -->
  <g fill="#e64a00">
    <path d="M 378 390 l 56 0 l 0 -14 l 28 21 l -28 21 l 0 -14 l -56 0 Z"/>
    <path d="M 758 390 l 56 0 l 0 -14 l 28 21 l -28 21 l 0 -14 l -56 0 Z"/>
  </g>

  <text x="600" y="660" text-anchor="middle" font-family="-apple-system,Arial,sans-serif" font-weight="700" font-size="22" fill="#c23f00">Returns Funda's own detail payload verbatim — no field lost to mapping</text>
</svg>
