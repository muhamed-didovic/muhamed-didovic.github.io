<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#502314" flood-opacity="0.13"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#502314" flood-opacity="0.28"/>
    </filter>
    <style><![CDATA[
      .title    { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .label    { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 500; }
      .small    { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
      .badge-num { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .mono     { font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace; font-weight: 400; }
    ]]></style>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <text x="800" y="92" text-anchor="middle" class="title" font-size="44" fill="#3E2021">How the Burger King Menu Scraper Works</text>
  <text x="800" y="138" text-anchor="middle" class="subtitle" font-size="22" fill="#8A6A55">From a street address to that restaurant's real prices and nutrition</text>
  <line x1="620" y1="170" x2="980" y2="170" stroke="#E6D2BC" stroke-width="2"/>

  <!-- ARROWS between the three cards -->
  <g stroke="#D72300" stroke-width="3" stroke-linecap="round">
    <line x1="516" y1="470" x2="556" y2="470"/>
    <path d="M556 470l-13-8v16z" fill="#D72300" stroke="none"/>
    <line x1="1044" y1="470" x2="1084" y2="470"/>
    <path d="M1084 470l-13-8v16z" fill="#D72300" stroke="none"/>
  </g>

  <!-- ============ CARD 1 — you give a location ============ -->
  <g filter="url(#cardShadow)"><rect x="80" y="230" width="436" height="480" rx="20" fill="#ffffff"/></g>
  <g filter="url(#badgeShadow)"><circle cx="118" cy="268" r="26" fill="#D72300"/></g>
  <text x="118" y="278" text-anchor="middle" class="badge-num" font-size="26" fill="#ffffff">1</text>
  <text x="162" y="278" class="card-title" font-size="27" fill="#3E2021">You give a location</text>

  <text x="112" y="330" class="label" font-size="18" fill="#8A6A55">Any of these, mixed freely, as many as you like</text>

  <g>
    <rect x="112" y="350" width="372" height="52" rx="10" fill="#FDF3E6" stroke="#EBD9C4"/>
    <text x="130" y="382" class="mono" font-size="17" fill="#502314">801 3rd Ave W, Birmingham, AL 35204</text>

    <rect x="112" y="414" width="372" height="52" rx="10" fill="#FDF3E6" stroke="#EBD9C4"/>
    <text x="130" y="446" class="mono" font-size="17" fill="#502314">290 Oxmoor Road, Birmingham, AL</text>

    <rect x="112" y="478" width="180" height="52" rx="10" fill="#FDF3E6" stroke="#EBD9C4"/>
    <text x="130" y="510" class="mono" font-size="17" fill="#502314">35209</text>

    <rect x="304" y="478" width="180" height="52" rx="10" fill="#FDF3E6" stroke="#EBD9C4"/>
    <text x="322" y="510" class="mono" font-size="17" fill="#502314">Birmingham, AL</text>

    <rect x="112" y="542" width="180" height="52" rx="10" fill="#F3EDE4" stroke="#E2D6C6"/>
    <text x="130" y="574" class="mono" font-size="17" fill="#7A6353">store #12427</text>
  </g>

  <text x="112" y="632" class="small" font-size="17" fill="#8A6A55">Street addresses, ZIP codes, city names</text>
  <text x="112" y="660" class="small" font-size="17" fill="#8A6A55">and store numbers all work in one run.</text>

  <!-- ============ CARD 2 — the restaurant is matched ============ -->
  <g filter="url(#cardShadow)"><rect x="556" y="230" width="488" height="480" rx="20" fill="#ffffff"/></g>
  <g filter="url(#badgeShadow)"><circle cx="594" cy="268" r="26" fill="#D72300"/></g>
  <text x="594" y="278" text-anchor="middle" class="badge-num" font-size="26" fill="#ffffff">2</text>
  <text x="638" y="278" class="card-title" font-size="27" fill="#3E2021">The restaurant is matched</text>

  <g>
    <rect x="588" y="322" width="424" height="76" rx="12" fill="#FDF3E6" stroke="#EBD9C4"/>
    <text x="608" y="350" class="label" font-size="17" fill="#8A6A55">Geocode</text>
    <text x="608" y="378" class="mono" font-size="16" fill="#502314">US Census → Nominatim fallback</text>

    <line x1="800" y1="404" x2="800" y2="428" stroke="#D9C3AC" stroke-width="2"/>
    <path d="M800 428l-7-11h14z" fill="#D9C3AC"/>

    <rect x="588" y="434" width="424" height="76" rx="12" fill="#FDF3E6" stroke="#EBD9C4"/>
    <text x="608" y="462" class="label" font-size="17" fill="#8A6A55">Nearest restaurant</text>
    <text x="608" y="490" class="mono" font-size="16" fill="#502314">RBI store search by coordinates</text>

    <line x1="800" y1="516" x2="800" y2="540" stroke="#D9C3AC" stroke-width="2"/>
    <path d="M800 540l-7-11h14z" fill="#D9C3AC"/>

    <rect x="588" y="546" width="424" height="112" rx="12" fill="#502314"/>
    <text x="608" y="580" class="label" font-size="16" fill="#E8C79B">MATCHED</text>
    <text x="608" y="612" class="card-title" font-size="22" fill="#ffffff">#12427 · 801 3rd Avenue W</text>
    <text x="608" y="640" class="small" font-size="17" fill="#D8BFA6">Birmingham, Alabama · drive-thru · open</text>
  </g>

  <!-- ============ CARD 3 — the menu comes back ============ -->
  <g filter="url(#cardShadow)"><rect x="1084" y="230" width="436" height="480" rx="20" fill="#ffffff"/></g>
  <g filter="url(#badgeShadow)"><circle cx="1122" cy="268" r="26" fill="#D72300"/></g>
  <text x="1122" y="278" text-anchor="middle" class="badge-num" font-size="26" fill="#ffffff">3</text>
  <text x="1166" y="278" class="card-title" font-size="27" fill="#3E2021">The menu comes back</text>

  <text x="1116" y="326" class="label" font-size="18" fill="#8A6A55">177 products, one row each</text>

  <g>
    <rect x="1116" y="344" width="372" height="104" rx="12" fill="#FDF3E6" stroke="#EBD9C4"/>
    <text x="1136" y="376" class="card-title" font-size="21" fill="#502314">Whopper</text>
    <text x="1136" y="404" class="mono" font-size="24" fill="#D72300">$5.89</text>
    <text x="1216" y="404" class="small" font-size="16" fill="#8A6A55">pickup · $7.09 delivery</text>
    <text x="1136" y="430" class="small" font-size="16" fill="#7A6353">710 cal · 34 g protein · 1250 mg sodium</text>

    <rect x="1116" y="460" width="372" height="76" rx="12" fill="#FDF3E6" stroke="#EBD9C4"/>
    <text x="1136" y="490" class="card-title" font-size="21" fill="#502314">Medium Fanta Orange</text>
    <text x="1136" y="518" class="mono" font-size="20" fill="#D72300">$2.79</text>
    <text x="1206" y="518" class="small" font-size="16" fill="#8A6A55">4 sizes · $1.69 to $3.19</text>

    <rect x="1116" y="548" width="372" height="76" rx="12" fill="#FDF3E6" stroke="#EBD9C4"/>
    <text x="1136" y="578" class="card-title" font-size="21" fill="#502314">Power Up Pack</text>
    <text x="1136" y="606" class="mono" font-size="20" fill="#D72300">$9.99</text>
    <text x="1206" y="606" class="small" font-size="16" fill="#8A6A55">combo · 3 items included</text>
  </g>

  <text x="1116" y="662" class="small" font-size="17" fill="#8A6A55">Plus allergens, images, day parts and</text>
  <text x="1116" y="688" class="small" font-size="17" fill="#8A6A55">every customisation option with its price.</text>

  <!-- FOOTER STRIP -->
  <rect x="80" y="754" width="1440" height="76" rx="16" fill="#502314"/>
  <g class="label" font-size="19" fill="#F4EBDC">
    <circle cx="146" cy="792" r="5" fill="#F0B25B"/><text x="166" y="799">Pure HTTP, no browser</text>
    <circle cx="470" cy="792" r="5" fill="#F0B25B"/><text x="490" y="799">No proxy required</text>
    <circle cx="764" cy="792" r="5" fill="#F0B25B"/><text x="784" y="799">No API key, no login</text>
    <circle cx="1086" cy="792" r="5" fill="#F0B25B"/><text x="1106" y="799">Prices are per restaurant</text>
  </g>
</svg>
