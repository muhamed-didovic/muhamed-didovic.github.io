<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#322A52"/>
      <stop offset="100%" stop-color="#1B152A"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <!-- everything inside "your" circle is cut out, leaving the keywords only the competitor has -->
    <mask id="gap">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <circle cx="206" cy="232" r="118" fill="#000000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <g fill="#FFFFFF" opacity="0.05">
    <circle cx="96" cy="96" r="5"/><circle cx="176" cy="96" r="5"/><circle cx="416" cy="96" r="5"/>
    <circle cx="96" cy="416" r="5"/><circle cx="416" cy="416" r="5"/>
  </g>

  <g filter="url(#ds)">
    <!-- competitor: the gap crescent is the bright part -->
    <circle cx="306" cy="232" r="108" fill="url(#green)" mask="url(#gap)"/>
    <circle cx="306" cy="232" r="108" fill="none" stroke="url(#green)" stroke-width="14"/>
    <!-- you -->
    <circle cx="206" cy="232" r="108" fill="#0E0B16" opacity="0.25"/>
    <circle cx="206" cy="232" r="108" fill="none" stroke="#A8A7B7" stroke-width="14" opacity="0.85"/>
  </g>

  <!-- ranking bars under the circles: you behind, competitor ahead -->
  <g filter="url(#ds)">
    <rect x="150" y="384" width="112" height="22" rx="11" fill="#A8A7B7" opacity="0.6"/>
    <rect x="150" y="420" width="212" height="22" rx="11" fill="url(#green)"/>
  </g>
</svg>
