<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15151D"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A1F"/>
      <stop offset="100%" stop-color="#FF8A1F" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- same descending-bars mark as the logo, scaled down as a corner lockup -->
  <g transform="translate(84,78) scale(0.34)">
    <rect x="92"  y="132" width="72"  height="260" rx="16" fill="#B24A00"/>
    <rect x="180" y="202" width="96"  height="190" rx="16" fill="#E86A00"/>
    <rect x="292" y="272" width="128" height="120" rx="16" fill="#FF8A1F"/>
  </g>

  <text x="240" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#F5F5F7">1688 Wholesale Scraper</text>
  <text x="240" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#FF8A1F">Tier pricing · MOQ · Supplier data</text>

  <rect x="84" y="262" width="1032" height="3" rx="1.5" fill="url(#rule)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#C9C9D4" font-size="30">
    <text x="84" y="340">Quantity-break price ladder, not just one price</text>
    <text x="84" y="398">Supplier company, location, repurchase rate</text>
    <text x="84" y="456">Filter by price, MOQ and province before billing</text>
    <text x="84" y="514">Keyword or URL · no login · JSON or CSV</text>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <circle cx="1050" cy="520" r="66" fill="#FF8A1F" opacity="0.12"/>
    <text x="1050" y="510" font-size="34" font-weight="700" fill="#FF8A1F" text-anchor="middle">1688</text>
    <text x="1050" y="544" font-size="20" fill="#9A9AA8" text-anchor="middle">.com</text>
  </g>
</svg>
