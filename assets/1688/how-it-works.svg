<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ff4000" flood-opacity="0.10"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#8a2400" flood-opacity="0.25"/>
    </filter>
    <style><![CDATA[
      .title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 500; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
      .badge-num { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .mono { font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace; font-weight: 400; }
    ]]></style>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- HEADER -->
  <text x="800" y="92" text-anchor="middle" class="title" font-size="44" fill="#3a1405">How the 1688 Wholesale Scraper Works</text>
  <text x="800" y="138" text-anchor="middle" class="subtitle" font-size="22" fill="#7a4a37">From a keyword or any 1688 offer URL to sourcing-grade wholesale data</text>
  <line x1="640" y1="170" x2="960" y2="170" stroke="#f3d2c2" stroke-width="2"/>

  <!-- ARROWS -->
  <g>
    <line x1="540" y1="490" x2="586" y2="490" stroke="#ff4000" stroke-width="3" stroke-linecap="round"/>
    <polygon points="586,490 574,484 574,496" fill="#ff4000"/>
  </g>
  <g>
    <line x1="1033" y1="490" x2="1079" y2="490" stroke="#ff4000" stroke-width="3" stroke-linecap="round"/>
    <polygon points="1079,490 1067,484 1067,496" fill="#ff4000"/>
  </g>

  <!-- ============= COLUMN 1: INPUT ============= -->
  <g>
    <rect x="80" y="220" width="453" height="540" rx="16" fill="#ffffff" stroke="#f3d2c2" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="120" cy="260" r="22" fill="#ff4000" filter="url(#badgeShadow)"/>
    <text x="120" y="268" text-anchor="middle" class="badge-num" font-size="22" fill="#ffffff">1</text>
    <text x="160" y="268" class="card-title" font-size="26" fill="#3a1405">Input</text>

    <!-- chip: Search query -->
    <rect x="110" y="316" width="393" height="62" rx="10" fill="#fff5f0" stroke="#f3d2c2" stroke-width="1"/>
    <circle cx="138" cy="347" r="14" fill="#ff4000"/>
    <path d="M 134 347 L 138 351 L 144 343" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="166" y="343" class="label" font-size="15" fill="#3a1405">Search keyword</text>
    <text x="166" y="365" class="small mono" font-size="12" fill="#8a5a45">phone case (or Chinese keyword)</text>

    <!-- chip: Offer URL -->
    <rect x="110" y="394" width="393" height="62" rx="10" fill="#fff5f0" stroke="#f3d2c2" stroke-width="1"/>
    <circle cx="138" cy="425" r="14" fill="#ff4000"/>
    <path d="M 134 425 L 138 429 L 144 421" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="166" y="421" class="label" font-size="15" fill="#3a1405">Offer / search URL</text>
    <text x="166" y="443" class="small mono" font-size="12" fill="#8a5a45">detail.1688.com/offer/{id}.html</text>

    <!-- URL handling note -->
    <text x="110" y="500" class="small" font-size="13" fill="#7a4a37">URL HANDLING</text>

    <g font-size="12" class="label" fill="#b3430f">
      <rect x="110" y="514" width="180" height="28" rx="14" fill="#fceadf" stroke="#f3c3a5" stroke-width="1"/>
      <text x="200" y="533" text-anchor="middle">~20 offers / page</text>
      <rect x="298" y="514" width="180" height="28" rx="14" fill="#fceadf" stroke="#f3c3a5" stroke-width="1"/>
      <text x="388" y="533" text-anchor="middle">paginates beginPage=N</text>

      <rect x="110" y="550" width="150" height="28" rx="14" fill="#fceadf" stroke="#f3c3a5" stroke-width="1"/>
      <text x="185" y="569" text-anchor="middle">bare offer IDs</text>
      <rect x="268" y="550" width="200" height="28" rx="14" fill="#fceadf" stroke="#f3c3a5" stroke-width="1"/>
      <text x="368" y="569" text-anchor="middle">desktop + mobile URLs</text>
    </g>

    <line x1="110" y1="688" x2="503" y2="688" stroke="#f8eee7" stroke-width="1"/>
    <text x="306" y="715" text-anchor="middle" class="small" font-size="13" fill="#7a4a37">Keywords, offer URLs &amp; IDs - one run</text>
  </g>

  <!-- ============= COLUMN 2: PROCESSING ============= -->
  <g>
    <rect x="573" y="220" width="453" height="540" rx="16" fill="#ffffff" stroke="#f3d2c2" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="613" cy="260" r="22" fill="#ff4000" filter="url(#badgeShadow)"/>
    <text x="613" y="268" text-anchor="middle" class="badge-num" font-size="22" fill="#ffffff">2</text>
    <text x="653" y="268" class="card-title" font-size="26" fill="#3a1405">Processing</text>

    <g class="label" font-size="15" fill="#3a1405">
      <circle cx="615" cy="335" r="11" fill="#ff4000"/>
      <text x="615" y="340" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">a</text>
      <text x="640" y="340">Normalize URL / ID to mobile URL</text>
      <line x1="615" y1="346" x2="615" y2="372" stroke="#f3c3a5" stroke-width="2"/>

      <circle cx="615" cy="385" r="11" fill="#ff4000"/>
      <text x="615" y="390" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">b</text>
      <text x="640" y="390">Warm cookies + residential fetch</text>
      <line x1="615" y1="396" x2="615" y2="422" stroke="#f3c3a5" stroke-width="2"/>

      <circle cx="615" cy="435" r="11" fill="#ff4000"/>
      <text x="615" y="440" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">c</text>
      <text x="640" y="440">Parse offer cards / __INIT_DATA</text>
      <line x1="615" y1="446" x2="615" y2="472" stroke="#f3c3a5" stroke-width="2"/>

      <circle cx="615" cy="485" r="11" fill="#ff4000"/>
      <text x="615" y="490" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">d</text>
      <text x="640" y="490">Extract tiers, MOQ, supplier, specs</text>
      <line x1="615" y1="496" x2="615" y2="522" stroke="#f3c3a5" stroke-width="2"/>

      <circle cx="615" cy="535" r="11" fill="#ff4000"/>
      <text x="615" y="540" text-anchor="middle" font-size="12" fill="#ffffff" class="badge-num">e</text>
      <text x="640" y="540">Push offer row to dataset</text>
    </g>

    <text x="603" y="600" class="small" font-size="13" fill="#7a4a37">PIPELINE</text>
    <g font-size="12" class="label">
      <rect x="603" y="614" width="150" height="28" rx="14" fill="#eaf6ee" stroke="#bce3c7" stroke-width="1"/>
      <text x="678" y="633" text-anchor="middle" fill="#1f6f37">impit + firefox TLS</text>

      <rect x="761" y="614" width="186" height="28" rx="14" fill="#eaf6ee" stroke="#bce3c7" stroke-width="1"/>
      <text x="854" y="633" text-anchor="middle" fill="#1f6f37">rotate IP on x5sec</text>

      <rect x="603" y="650" width="164" height="28" rx="14" fill="#fceadf" stroke="#f3c3a5" stroke-width="1"/>
      <text x="685" y="669" text-anchor="middle" fill="#b3430f">no login, no cookies</text>

      <rect x="775" y="650" width="176" height="28" rx="14" fill="#fceadf" stroke="#f3c3a5" stroke-width="1"/>
      <text x="863" y="669" text-anchor="middle" fill="#b3430f">optional detail: specs+imgs</text>
    </g>

    <line x1="603" y1="688" x2="996" y2="688" stroke="#f8eee7" stroke-width="1"/>
    <text x="799" y="715" text-anchor="middle" class="small" font-size="13" fill="#7a4a37">Residential proxies - mobile surface - HTTP-only</text>
  </g>

  <!-- ============= COLUMN 3: OUTPUT ============= -->
  <g>
    <rect x="1066" y="220" width="453" height="540" rx="16" fill="#ffffff" stroke="#f3d2c2" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="1106" cy="260" r="22" fill="#ff4000" filter="url(#badgeShadow)"/>
    <text x="1106" y="268" text-anchor="middle" class="badge-num" font-size="22" fill="#ffffff">3</text>
    <text x="1146" y="268" class="card-title" font-size="26" fill="#3a1405">Output</text>

    <!-- dataset row pill: one offer per row -->
    <rect x="1096" y="316" width="393" height="318" rx="12" fill="#2c1004" stroke="#8a2400" stroke-width="1"/>
    <text x="1116" y="343" class="mono" font-size="13" fill="#f7a877">offerId:</text>
    <text x="1186" y="343" class="mono" font-size="13" fill="#ffd47a">990321853701</text>

    <text x="1116" y="364" class="mono" font-size="13" fill="#f7a877">title:</text>
    <text x="1162" y="364" class="mono" font-size="13" fill="#ffffff">Samsung Z Fold6 magnetic case</text>

    <text x="1116" y="385" class="mono" font-size="13" fill="#f7a877">price:</text>
    <text x="1162" y="385" class="mono" font-size="13" fill="#ffffff">CNY 45.00 ~ 50.00</text>

    <text x="1116" y="406" class="mono" font-size="13" fill="#f7a877">tierPricing:</text>
    <text x="1206" y="406" class="mono" font-size="13" fill="#ffffff">10-&gt;50 - 500-&gt;48 - 10k-&gt;45</text>

    <text x="1116" y="427" class="mono" font-size="13" fill="#f7a877">moq:</text>
    <text x="1152" y="427" class="mono" font-size="13" fill="#ffd47a">10</text>

    <text x="1116" y="448" class="mono" font-size="13" fill="#f7a877">soldCount:</text>
    <text x="1196" y="448" class="mono" font-size="13" fill="#ffffff">100+</text>

    <text x="1116" y="469" class="mono" font-size="13" fill="#f7a877">supplierName:</text>
    <text x="1226" y="469" class="mono" font-size="13" fill="#ffffff">Fengmei (Dongguan) Tech</text>

    <text x="1116" y="490" class="mono" font-size="13" fill="#f7a877">supplierYears:</text>
    <text x="1226" y="490" class="mono" font-size="13" fill="#ffffff">7 yrs</text>

    <text x="1116" y="511" class="mono" font-size="13" fill="#f7a877">location:</text>
    <text x="1180" y="511" class="mono" font-size="13" fill="#ffffff">Guangdong Dongguan</text>

    <text x="1116" y="532" class="mono" font-size="13" fill="#f7a877">attributes:</text>
    <text x="1200" y="532" class="mono" font-size="13" fill="#ffffff">{material:PC, craft:matte, ...}</text>

    <text x="1116" y="553" class="mono" font-size="13" fill="#f7a877">images:</text>
    <text x="1172" y="553" class="mono" font-size="13" fill="#ffffff">[5 gallery URLs]</text>

    <text x="1116" y="574" class="mono" font-size="13" fill="#f7a877">offerUrl:</text>
    <text x="1182" y="574" class="mono" font-size="13" fill="#ffd47a">/offer/...853701.html</text>

    <text x="1116" y="595" class="mono" font-size="11" fill="#a06550">// one clean offer per row - tiers, MOQ &amp; specs with scrapeDetails</text>

    <!-- format chips -->
    <g font-size="12" class="label" fill="#ffffff">
      <rect x="1096" y="650" width="64" height="28" rx="14" fill="#ff4000"/>
      <text x="1128" y="669" text-anchor="middle">JSON</text>
      <rect x="1168" y="650" width="64" height="28" rx="14" fill="#ff4000"/>
      <text x="1200" y="669" text-anchor="middle">CSV</text>
      <rect x="1240" y="650" width="100" height="28" rx="14" fill="#ff4000"/>
      <text x="1290" y="669" text-anchor="middle">Apify Dataset</text>
    </g>

    <line x1="1096" y1="688" x2="1489" y2="688" stroke="#f8eee7" stroke-width="1"/>
    <text x="1292" y="715" text-anchor="middle" class="small" font-size="13" fill="#7a4a37">One clean row per offer</text>
  </g>

  <!-- BOTTOM STRIP -->
  <rect x="80" y="800" width="1440" height="56" rx="12" fill="#ff4000"/>
  <text x="800" y="836" text-anchor="middle" class="label" font-size="18" fill="#ffffff">Tier pricing - MOQ - Supplier &amp; location - SKU attributes - Image galleries - Sold counts</text>
</svg>
