<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f1ff"/>
    </linearGradient>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#F9CE34"/>
      <stop offset="28%" stop-color="#EE2A7B"/>
      <stop offset="62%" stop-color="#C13584"/>
      <stop offset="100%" stop-color="#6228D7"/>
    </linearGradient>
    <filter id="ds" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2a0a3a" flood-opacity="0.16"/>
    </filter>
    <style><![CDATA[
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .s   { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; }
      .mono{ font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace; font-weight: 500; }
    ]]></style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#ig)"/>

  <!-- ============ LEFT ============ -->
  <g transform="translate(72, 88)">
    <rect width="92" height="92" rx="22" fill="url(#ig)"/>
    <rect x="26" y="16" width="40" height="60" rx="9" fill="#ffffff"/>
    <g transform="translate(46,46)">
      <circle r="14" fill="#C13584"/>
      <polygon points="-4.5,-7 -4.5,7 7,0" fill="#ffffff"/>
    </g>

    <text x="118" y="40" class="t" font-size="40" fill="#1c1030">Instagram Reel</text>
    <text x="118" y="84" class="t" font-size="40" fill="#1c1030">Scraper</text>
  </g>

  <g transform="translate(72, 238)">
    <text x="0" y="0"  class="s" font-size="25" fill="#5b4a75">Every reel on any public profile, newest first,</text>
    <text x="0" y="38" class="s" font-size="25" fill="#5b4a75">with play counts that are actually populated.</text>
  </g>

  <g transform="translate(72, 322)">
    <g>
      <rect width="238" height="46" rx="23" fill="#ffffff" stroke="#e6dcf5" stroke-width="2"/>
      <text x="119" y="30" text-anchor="middle" class="lbl" font-size="18" fill="#C13584">Play counts on every row</text>
    </g>
    <g transform="translate(254, 0)">
      <rect width="182" height="46" rx="23" fill="#ffffff" stroke="#e6dcf5" stroke-width="2"/>
      <text x="91" y="30" text-anchor="middle" class="lbl" font-size="18" fill="#C13584">Date cut-off</text>
    </g>
    <g transform="translate(0, 62)">
      <rect width="216" height="46" rx="23" fill="#ffffff" stroke="#e6dcf5" stroke-width="2"/>
      <text x="108" y="30" text-anchor="middle" class="lbl" font-size="18" fill="#6228D7">No login, no browser</text>
    </g>
    <g transform="translate(232, 62)">
      <rect width="204" height="46" rx="23" fill="#ffffff" stroke="#e6dcf5" stroke-width="2"/>
      <text x="102" y="30" text-anchor="middle" class="lbl" font-size="18" fill="#6228D7">55 fields per reel</text>
    </g>
  </g>

  <text x="72" y="556" class="mono" font-size="19" fill="#7a6b92">apify.com/memo23/instagram-reel-scraper</text>

  <!-- ============ RIGHT: reel frame ============ -->
  <g transform="translate(700, 84)" filter="url(#ds)">
    <rect width="300" height="440" rx="34" fill="#1c1030"/>
    <rect x="14" y="14" width="272" height="412" rx="24" fill="url(#ig)" opacity="0.92"/>

    <!-- play badge -->
    <g transform="translate(150,182)">
      <circle r="52" fill="#ffffff" opacity="0.94"/>
      <polygon points="-16,-25 -16,25 25,0" fill="#C13584"/>
    </g>

    <!-- stat plate -->
    <g transform="translate(38,286)">
      <rect width="224" height="112" rx="18" fill="#ffffff" opacity="0.95"/>
      <text x="18" y="34" class="mono" font-size="15" fill="#7a6b92">playCount</text>
      <text x="18" y="70" class="t"    font-size="34" fill="#1c1030">3,066,548</text>
      <text x="18" y="96" class="mono" font-size="14" fill="#7a6b92">countsHidden: false</text>
    </g>
  </g>

  <!-- page chips -->
  <g transform="translate(700, 552)">
    <g>
      <rect width="92" height="38" rx="10" fill="#ffffff" stroke="#e6dcf5" stroke-width="2"/>
      <text x="46" y="25" text-anchor="middle" class="mono" font-size="14" fill="#6228D7">page 1</text>
    </g>
    <g transform="translate(104,0)">
      <rect width="92" height="38" rx="10" fill="#ffffff" stroke="#e6dcf5" stroke-width="2"/>
      <text x="46" y="25" text-anchor="middle" class="mono" font-size="14" fill="#6228D7">page 2</text>
    </g>
    <g transform="translate(208,0)">
      <rect width="92" height="38" rx="10" fill="#ffffff" stroke="#e6dcf5" stroke-width="2"/>
      <text x="46" y="25" text-anchor="middle" class="mono" font-size="14" fill="#6228D7">page 3</text>
    </g>
  </g>
</svg>
